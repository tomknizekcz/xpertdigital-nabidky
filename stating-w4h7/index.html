<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AI mapa STATING</title>
<meta name="description" content="Personalizovaná AI mapa XpertDigital pro STATING s.r.o.: co za 3 měsíce udělá AI tým.">
<meta property="og:title" content="AI mapa STATING">
<meta property="og:description" content="Personalizovaná AI mapa XpertDigital pro STATING s.r.o.: co za 3 měsíce udělá AI tým.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23FA2B2B'/%3E%3Cpath d='M19 17h8.5L32 24l4.5-7H45L36.5 32 45 47h-8.5L32 40l-4.5 7H19l8.5-15z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   XpertDigital · AI mapa — šablona (engine + vzhled)
   Obsah klienta je v data/<klient>.js, tento soubor se nemění.
   ============================================================ */
:root{
  --red:#FA2B2B; --red-ink:#D31414; --red-btn:#E52020; --red-on-dark:#FF6B6B;
  --red-50:#FFF1F1; --red-100:#FFE1E1;
  --ink:#232323; --text:#484848; --muted:#6B6B6B; --faint:#9A9A9A;
  --line:#E2E2E2; --line-2:#EEEEEE;
  --bg:#ECECEC; --dot:#D2D2D2; --panel:#FFFFFF; --panel-2:#F7F7F7;
  --dark:#333333; --dark-2:#3D3D3D; --dark-3:#282828; --dark-line:#4B4B4B;
  --on-dark:#FFFFFF; --on-dark-muted:#C2C2C2;
  --green:#15805A; --green-50:#E6F5EE; --amber:#9A6200; --amber-50:#FFF3D9;
  --r-xl:32px; --r-lg:24px; --r-md:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
/* Záměrně jeden světlý vzhled podle webu XpertDigital; všechny barvy jsou nastavené explicitně. */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;font-size:16px}
body.linear{overflow:auto;height:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.display{font-stretch:72%;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:.9;color:var(--ink)}

/* ---------- Top bar ---------- */
.topbar{position:fixed;z-index:40;top:calc(12px + var(--sat));left:12px;right:12px;height:60px;display:flex;align-items:center;gap:20px;padding:0 10px 0 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;flex:none}
.brand svg{height:30px;width:auto;display:block}
.tb-copy{display:flex;flex-direction:column;min-width:0;line-height:1.25;border-left:1px solid var(--line);padding-left:20px}
.tb-client[hidden]{display:none}
.tb-client{display:flex;align-items:center;gap:10px;border-left:1px solid var(--line);padding-left:20px;flex:none}
.tb-client span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tb-client img{height:28px;width:auto;max-width:170px;object-fit:contain;display:block}
.profile-logo{display:block;height:52px;width:auto;max-width:100%;object-fit:contain;object-position:left center;margin-top:14px}
.tb-copy strong{font-size:16px;color:var(--ink);font-weight:700}
.tb-copy span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:10px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .15s,transform .15s,box-shadow .15s}
.btn-red{background:var(--red-btn);color:#fff;padding:12px 18px;box-shadow:0 6px 16px rgba(229,32,32,.28)}
.btn-red:hover{background:#cc1818}
.btn-ghost{border:1px solid var(--line);padding:11px 16px;background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.topbar .btn-red{margin-left:auto}

/* ---------- Floating controls ---------- */
.fab{position:fixed;z-index:35;width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.08);color:var(--ink)}
.fab:hover{border-color:var(--ink)}
.menu-btn{top:calc(88px + var(--sat));left:12px}
.zoomctl{position:fixed;z-index:35;right:12px;bottom:calc(16px + var(--sab));display:flex;flex-direction:column;align-items:center;gap:8px}
.zoomctl button{width:48px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.zoomctl button:hover{border-color:var(--ink)}
.zpct{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{position:fixed;z-index:30;left:50%;bottom:calc(18px + var(--sab));transform:translateX(-50%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:13px;color:var(--muted);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.modelbadge{position:fixed;z-index:30;left:12px;bottom:calc(18px + var(--sab));font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
body.linear .zoomctl,body.linear .hint{display:none}
body.linear .menu-btn{position:fixed;top:auto;bottom:calc(16px + var(--sab));left:auto;right:12px}
body.linear .modelbadge{display:none}

/* ---------- Viewport & world ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.4px);background-size:28px 28px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;padding:150px 170px 220px;user-select:none;-webkit-user-select:none}
#world.anim{will-change:transform}
body.linear #viewport{position:static;overflow:visible;touch-action:auto;cursor:auto}
body.linear #world{position:static;transform:none!important;width:auto;max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:92px 88px;user-select:text;-webkit-user-select:text}
.row{display:flex;align-items:flex-start}
.row>.conn{align-self:stretch}
.row-2{display:block;margin-top:220px}
body.linear .row{flex-direction:column}
body.linear .row-2{margin-top:40px}
.sec{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:64px 68px 60px;box-shadow:var(--shadow);scroll-margin-top:90px}
body:not(.linear) .sec-a{width:1700px}
body:not(.linear) .sec-b{width:1700px}
body:not(.linear) .sec-c{width:2080px}
body:not(.linear) .sec-d{width:1700px}
body.linear .sec{padding:30px 20px 28px;border-radius:24px;margin-bottom:22px}
.conn{width:190px;display:flex;align-items:center;justify-content:center;flex:none}
.conn-in{display:flex;align-items:center;width:100%;padding:0 14px}
.conn-dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--red);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--red-ink);background:#fff;flex:none}
.conn-dot.on{background:var(--red);color:#fff}
.conn-line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 14px)}
body.linear .conn{display:none}

/* ---------- Section typography ---------- */
.chip-sec{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:30px}
.chip-sec b{min-width:32px;height:32px;padding:0 8px;border-radius:16px;border:2px solid var(--red);color:var(--red-ink);display:grid;place-items:center;font-size:14px;letter-spacing:0}
.kicker{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red-ink);margin-bottom:18px}
.h2{font-size:78px;margin:0}
body.linear .h2{font-size:clamp(34px,7vw,64px)}
.lead{font-size:21px;line-height:1.45;color:var(--text);max-width:820px;margin:20px 0 0}
body.linear .lead{font-size:18px}

/* ---------- A · hero ---------- */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px;align-items:start}
body:not(.linear) .hero-grid{grid-template-columns:980px 1fr;gap:60px}
.hero-title{font-size:156px;margin:0}
.hero-title span{display:block}
.hero-title .accent{color:var(--red)}
body.linear .hero-title{font-size:clamp(46px,11vw,120px)}
.hero-lead{font-size:23px;line-height:1.45;margin:28px 0 0;max-width:820px}
.hero-lead strong{color:var(--ink)}
body.linear .hero-lead{font-size:18px}
.pains{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-top:34px}
.pain{display:block;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;transition:border-color .15s,background .15s,box-shadow .15s}
.pain:hover{border-color:var(--red);background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.06)}
.pain-top{display:flex;align-items:center;gap:12px}
.pain-ic{width:38px;height:38px;border-radius:11px;background:var(--red-50);color:var(--red);display:grid;place-items:center;flex:none}
.pain-val{font-stretch:74%;font-weight:800;font-size:44px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.pain-label{font-size:15px;line-height:1.4;margin-top:10px;color:var(--text)}
.pain-agent{margin-top:12px;font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--red-ink);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.pain-agent .ic{width:14px;height:14px}
.hero-side{display:flex;flex-direction:column;gap:18px}
.profile{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff}
.profile-art{background:var(--panel-2);border-bottom:1px solid var(--line);padding:22px 24px 16px}
.profile-art svg{display:block;width:100%;height:auto}
.profile-body{padding:22px 24px 22px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--red);color:#fff;border-radius:6px;padding:4px 8px}
.profile-name{font-size:30px;font-weight:800;color:var(--ink);margin-top:12px;line-height:1.1}
.profile-obor{font-size:16px;color:var(--muted);margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px}
.fact{background:#fff;padding:12px 14px}
.fact b{display:block;font-stretch:78%;font-size:22px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.profile-note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.45}
.story{background:var(--dark);color:#fff;border-radius:24px;padding:26px 26px 22px}
.story-val{font-stretch:72%;font-weight:800;font-size:64px;line-height:1;color:var(--red)}
.story p{font-size:18px;line-height:1.45;margin:10px 0 16px;color:#fff}
.story-tag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-muted);border-top:1px solid var(--dark-line);padding-top:12px}
.feed{background:var(--dark-3);color:#fff;border-radius:24px;padding:20px 22px 12px}
.feed-head{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-muted)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(250,43,43,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,43,43,.55)}70%{box-shadow:0 0 0 10px rgba(250,43,43,0)}100%{box-shadow:0 0 0 0 rgba(250,43,43,0)}}
.feed-list{list-style:none;margin:12px 0 0;padding:0;min-height:300px}
.feed-list li{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-top:1px solid #3a3a3a;font-size:14px;line-height:1.4;color:#EDEDED}
.feed-list li.new{animation:feedIn .45s ease-out}
@keyframes feedIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.feed-time{font-variant-numeric:tabular-nums;color:var(--on-dark-muted);font-size:13px}
.feed-agent{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red-on-dark);margin-bottom:2px}

/* ---------- B · kalkulačka ---------- */
.b-head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;justify-content:space-between}
.cur{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.cur button{padding:9px 16px;font-weight:800;font-size:14px;color:var(--muted)}
.cur button[aria-pressed="true"]{background:var(--ink);color:#fff}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:30px;margin-top:34px;align-items:start}
body:not(.linear) .calc{grid-template-columns:660px 1fr}
.result{background:var(--dark);color:#fff;border-radius:26px;padding:28px 28px 24px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--on-dark-muted)}
.res-val{font-stretch:72%;font-weight:800;font-size:84px;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums;color:#fff}
.res-val.pos{color:#fff}
body.linear .res-val{font-size:clamp(40px,11vw,84px)}
.calc>*,.b-head>div,.hero-grid>*{min-width:0}
.res-val.pos::first-letter{color:var(--red)}
.res-sub{font-size:16px;color:var(--on-dark-muted);margin-top:8px;font-variant-numeric:tabular-nums}
.res-sub b{color:#fff}
.target{margin-top:22px;background:var(--dark-2);border-radius:18px;padding:18px 18px 16px}
.target-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.target-v{font-stretch:78%;font-weight:800;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
.track{position:relative;height:14px;border-radius:7px;background:#555;margin:16px 0 10px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--red);transition:width .35s}
.track .over{position:absolute;top:0;bottom:0;border-radius:0 7px 7px 0;background:repeating-linear-gradient(45deg,#FF8A8A 0 6px,#FA2B2B 6px 12px);transition:left .35s,width .35s}
.track .mark{position:absolute;top:-5px;width:3px;height:24px;border-radius:2px;background:#fff}
.track-lbls{display:flex;justify-content:space-between;font-size:12px;color:var(--on-dark-muted);font-variant-numeric:tabular-nums}
.target-msg{font-size:15px;line-height:1.45;margin-top:12px;color:#EDEDED}
.target-msg b{color:#fff}
.wf{margin-top:18px;background:#fff;border-radius:18px;padding:14px 14px 8px;color:var(--text)}
.wf svg{display:block;width:100%;height:auto}
.disclaim{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--on-dark-muted);margin-top:14px;line-height:1.45}
.disclaim .ic{width:16px;height:16px;margin-top:2px}
details.how{margin-top:12px;font-size:13.5px;color:var(--on-dark-muted);line-height:1.5}
details.how summary{cursor:pointer;font-weight:700;color:#fff}
details.how table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
details.how td{padding:5px 0;border-top:1px solid #4a4a4a}
details.how td:last-child{text-align:right;color:#fff}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:14px}
.area{border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;background:var(--panel-2);transition:border-color .2s,background .2s,box-shadow .2s}
.area.on{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px var(--red-50)}
.area-head{display:flex;align-items:center;gap:12px}
.area-ic{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--muted);display:grid;place-items:center;flex:none;transition:.2s}
.area.on .area-ic{background:var(--red);border-color:var(--red);color:#fff}
.area-t{font-weight:800;font-size:17px;color:var(--ink);line-height:1.2}
.area-a{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.switch{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);flex:none}
.switch .knob{width:44px;height:26px;border-radius:13px;background:#cfcfcf;position:relative;transition:.2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.switch[aria-checked="true"]{color:var(--red-ink)}
.switch[aria-checked="true"] .knob{background:var(--red)}
.switch[aria-checked="true"] .knob::after{left:21px}
.area-items{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.area-items span{font-size:12.5px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--text)}
.area-arrows{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.area-arrows span{display:inline-flex;align-items:center;gap:4px}
.area-arrows .ic{width:14px;height:14px;color:var(--red)}
.area-ctl{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.area-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px}
.area-row b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.area-row .lift{font-stretch:78%;font-weight:800;font-size:22px;color:var(--red-ink);font-variant-numeric:tabular-nums}
.area:not(.on) .area-row .lift{color:var(--faint)}
.area-sub{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:6px 0 2px;cursor:pointer}
input[type=range]:disabled{cursor:not-allowed;opacity:.45}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) 0 var(--p,0%),#d9d9d9 var(--p,0%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--red);margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#d9d9d9}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--red)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--red)}

/* ---------- C · co bude hotové ---------- */
.deliver{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin-top:40px}
.dcol{background:var(--panel-2);border:1px solid var(--line);border-radius:22px;padding:26px 24px 18px}
.dcol-num{font-stretch:72%;font-weight:800;font-size:40px;line-height:1;color:var(--red);text-transform:uppercase}
.dcol-title{font-weight:800;letter-spacing:.07em;font-size:18px;text-transform:uppercase;color:var(--ink);margin-top:14px}
.dcol-agent{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);margin-top:6px}
.dcol-agent .ic{width:17px;height:17px;color:var(--red)}
.dcol ul{list-style:none;margin:18px 0 0;padding:0}
.dcol li{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:17.5px;line-height:1.35;color:var(--text)}
.dcol li .ic{color:var(--red);width:18px;height:18px;margin-top:2px;stroke-width:2.4}
body.linear .dcol li{font-size:15.5px;padding:9px 0}

/* ---------- D · co potřebujete ---------- */
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:22px}
.pills span{font-stretch:78%;font-weight:800;font-size:30px;text-transform:uppercase;color:var(--ink);border:2px solid var(--ink);border-radius:14px;padding:6px 16px}
.pills i{font-style:normal;font-weight:800;font-size:30px;color:var(--red)}
.tl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:34px}
.tl-seg{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;border-top:4px solid var(--red)}
.tl-seg b{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tl-seg span{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-top:4px;line-height:1.25}
.tl-after{margin-top:6px;background:var(--dark);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl-after b{font-weight:800}
@media (max-width:760px){.tl{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
.tl-seg.opt{border-top-style:dashed}
.mods{display:grid;gap:8px;margin-top:8px}
.mods:empty{display:none}
.mod-row{display:flex;align-items:center;gap:14px;border:1px dashed #C9C9C9;border-radius:14px;padding:12px 16px;background:#fff}
.mod-row.on{border-style:solid;border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.mod-row b{display:block;color:var(--ink);font-size:15px;line-height:1.3}
.mod-row .t{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.mod-row .switch,.lane-mod .switch{margin-left:0}
.area-mod{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red-ink);margin-top:4px}
.lane.off{opacity:.62}
.lane-mod{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border:1px dashed #6a6a6a;border-radius:14px;font-size:14px;line-height:1.4;color:#EDEDED}
.lane-mod .switch{color:#E6E6E6}
.lane-mod .switch[aria-checked="true"]{color:var(--red-on-dark)}
.lane.off .lane-num{-webkit-text-stroke-color:#9a9a9a}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:26px}
.prod{border:1px solid var(--line);border-radius:22px;padding:24px 22px 18px;background:#fff;display:flex;flex-direction:column}
.prod.hl{background:var(--dark);border-color:var(--dark);color:#fff}
.prod-num{font-stretch:72%;font-weight:800;font-size:34px;line-height:1;color:var(--red);text-transform:uppercase}
.prod-name{font-size:22px;font-weight:800;line-height:1.15;margin-top:10px;color:var(--ink)}
.prod.hl .prod-name{color:#fff}
.prod-sub{font-size:14px;color:var(--muted);margin-top:6px}
.prod.hl .prod-sub{color:var(--on-dark-muted)}
.prod ul{list-style:none;margin:14px 0 0;padding:0}
.prod li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line-2);font-size:16px;line-height:1.4}
body.linear .prod li{font-size:14.5px}
.prod.hl li{border-color:var(--dark-line)}
.prod li .ic{color:var(--red);width:16px;height:16px;margin-top:2px;stroke-width:2.4}
.cta-box{margin-top:26px;border-radius:22px;background:var(--red-50);border:1px solid var(--red-100);padding:24px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:space-between}
.cta-box strong{display:block;font-size:22px;color:var(--ink)}
.cta-box .btn,.weeks-end .btn{white-space:normal}
body.linear .cta-box{padding:18px}
.cta-box span{font-size:15px;color:var(--text)}

/* ---------- Týdny ---------- */
.weeks-head{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:56px 60px;box-shadow:var(--shadow);margin-bottom:56px;display:grid;grid-template-columns:1fr;gap:34px;align-items:end;scroll-margin-top:90px}
body:not(.linear) .row-2{display:flex;align-items:flex-start;gap:60px}
body:not(.linear) .weeks-head{width:1320px;flex:none;margin:0}
body:not(.linear) .weeks-head .h2{font-size:96px}
body:not(.linear) .legend{justify-content:flex-start;max-width:none}
body:not(.linear) .legend span{font-size:16px;padding:7px 16px 7px 7px}
body:not(.linear) .legend span i{width:34px;height:34px}
body.linear .weeks-head{grid-template-columns:1fr;padding:28px 20px;border-radius:24px;margin-bottom:22px;gap:20px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.legend span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel-2)}
.legend span i{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.legend span i .ic{width:14px;height:14px}
.wk-list{display:grid;gap:8px}
.wk{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:16px;padding:12px 18px 12px 12px;background:var(--panel-2);transition:border-color .15s,background .15s}
.wk:hover{border-color:var(--red);background:#fff}
.wk-n{min-width:52px;padding:0 8px;height:52px;border-radius:14px;background:var(--dark);color:#fff;display:grid;place-items:center;font-stretch:74%;font-weight:800;font-size:28px}
.wk-t b{display:block;font-size:19px;color:var(--ink);line-height:1.2}
.wk-t span{font-size:14px;color:var(--muted)}
.wk-i{text-align:right;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wk-i b{display:block;font-stretch:76%;font-size:26px;color:var(--red-ink);letter-spacing:0}
body.linear .wk-t b{font-size:16px}
@media (max-width:560px){.wk{grid-template-columns:44px 1fr}.wk-n{width:44px;height:44px;font-size:22px}.wk-i{display:none}}
.lanes{display:flex;gap:60px;align-items:flex-start}
body.linear .lanes{flex-direction:column;align-items:stretch;gap:22px}
.lane{background:var(--dark);border-radius:var(--r-xl);padding:26px;color:#fff;box-shadow:0 20px 40px rgba(0,0,0,.18);scroll-margin-top:90px}
body:not(.linear) .lane{width:660px;flex:none}
body.linear .lane{padding:20px 14px;border-radius:24px}
.lane-head{padding:10px 8px 26px}
.lane-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.lane-num{font-stretch:72%;font-weight:800;font-size:132px;line-height:.78;color:transparent;-webkit-text-stroke:2px var(--red)}
.lane-impact{text-align:right}
.lane-impact b{display:block;font-stretch:74%;font-weight:800;font-size:44px;line-height:1;color:#fff}
.lane-impact span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--on-dark-muted)}
.lane-kick{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--red-on-dark);margin-top:22px;text-transform:uppercase}
.lane-title{font-stretch:80%;font-weight:800;font-size:36px;line-height:1.02;text-transform:uppercase;margin:8px 0 18px;color:#fff}
body.linear .lane-title{font-size:28px}
.agent-chip{display:inline-flex;gap:10px;align-items:center;background:var(--dark-2);border:1px solid var(--dark-line);border-radius:999px;padding:5px 16px 5px 5px}
.agent-chip i{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.agent-chip b{font-size:15px}
.agent-chip span{font-size:13px;color:var(--on-dark-muted)}
.lane-arrows{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:16px;font-size:14px;color:#E6E6E6}
.lane-arrows span{display:inline-flex;align-items:center;gap:5px}
.lane-arrows .ic{width:15px;height:15px;color:var(--red-on-dark)}
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
body:not(.linear) .cards{grid-template-columns:minmax(0,1fr)}
.cards>*,.card-prev,.blk{min-width:0}
.card{background:#fff;color:var(--text);border-radius:22px;padding:24px 24px 20px;cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative}
.card:hover{box-shadow:0 0 0 3px var(--red),0 18px 36px rgba(0,0,0,.3)}
.card-meta{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.card-id{background:var(--red);color:#fff;border-radius:7px;padding:4px 8px;letter-spacing:.02em;font-size:12px}
.card-title{font-size:25px;line-height:1.15;font-weight:800;color:var(--ink);margin:14px 0 8px}
.card-desc{font-size:15.5px;line-height:1.5;margin:0}
.prompt{margin-top:14px;background:var(--panel-2);border:1px dashed #CFCFCF;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;display:flex;gap:12px;color:var(--ink)}
.prompt-lbl{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--red-ink);padding-top:3px;flex:none}
.booster{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;line-height:1.8}
.booster code{font-family:var(--mono);text-transform:none;letter-spacing:0;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);padding:1px 6px;border-radius:6px;font-size:12px;font-weight:500}
.card-prev{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2);max-height:360px;overflow:hidden;position:relative;pointer-events:none}
.card-prev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(255,255,255,0),#fff)}
.card-open{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--red-ink);border-radius:10px;padding:8px 12px 8px 0}
.card-open .ic{width:16px;height:16px;transition:transform .15s}
.card:hover .card-open .ic{transform:translateX(4px)}
.weeks-end{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:40px;box-shadow:var(--shadow);width:520px;flex:none;align-self:flex-start;margin-top:0}
body.linear .weeks-end{width:auto;padding:26px 20px;border-radius:24px}
.weeks-end h3{font-size:34px;margin:14px 0 10px}
.weeks-end p{font-size:16px;line-height:1.5;margin:0 0 20px}
.weeks-end .btns{display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* ---------- Bloky výstupů (karta i detail) ---------- */
.blk+.blk{margin-top:22px}
.blk-title{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.fields{display:grid;grid-template-columns:180px 1fr;margin:0}
.fields dt{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red-ink);padding:11px 14px 11px 0;border-top:1px solid var(--line-2);line-height:1.5}
.fields dd{margin:0;padding:10px 0;border-top:1px solid var(--line-2);font-size:15px;line-height:1.55;color:var(--text)}
.fields dt:first-of-type,.fields dt:first-of-type+dd{border-top:0}
.c .fields{grid-template-columns:120px 1fr}
.c .fields dd{font-size:14px}
@media (max-width:560px){.fields,.c .fields{grid-template-columns:1fr}.fields dt{padding-bottom:0}.fields dd{border-top:0;padding-top:4px}}
.txt p{margin:0 0 10px;font-size:15.5px;line-height:1.6}
.txt p:last-child{margin-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);padding:10px 12px;font-weight:800;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line-2);vertical-align:top;line-height:1.45;color:var(--text)}
.tbl td:first-child{color:var(--ink);font-weight:600}
.tbl .num{text-align:right;white-space:nowrap}
.tbl-note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.c table.tbl{font-size:13px}
.c .tbl td,.c .tbl th{padding:8px 10px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.4}
.pill.ok{background:var(--green-50);color:var(--green)}
.pill.warn{background:var(--amber-50);color:var(--amber)}
.pill.bad{background:var(--red-50);color:var(--red-ink)}
.pill.info{background:#EFEFEF;color:#4A4A4A}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
.kpi-v{font-stretch:76%;font-weight:800;font-size:31px;color:var(--ink);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi-l{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.kpi-d{font-size:12.5px;font-weight:700;margin-top:6px;color:var(--muted)}
.kpi-d.good{color:var(--green)}
.kpi-d.bad{color:var(--red-ink)}
.c .kpi-v{font-size:26px}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 104px;gap:12px;align-items:center;font-size:14px}
.bar-l{color:var(--ink);font-weight:600;line-height:1.3}
.bar-track{height:14px;background:var(--panel-2);border-radius:7px;position:relative;overflow:hidden;border:1px solid var(--line-2)}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--red)}
.bar-fill.dark{background:var(--text)}
.bar-fill.good{background:var(--green)}
.bar-fill.muted{background:#BDBDBD}
.bar-v{text-align:right;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.bar-row{grid-template-columns:1fr 84px}.bar-track{grid-column:1/-1;grid-row:2}}
.score{display:grid;gap:14px}
.score-row{display:grid;grid-template-columns:130px 1fr 70px;gap:14px;align-items:center}
.score-row span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.score-row b{font-stretch:74%;font-size:40px;font-weight:800;color:var(--ink);text-align:right;line-height:1}
.score-row.after b{color:var(--red)}
.score-bar{height:18px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.score-bar i{display:block;height:100%;background:#9E9E9E;border-radius:9px}
.score-row.after .score-bar i{background:var(--red)}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:14px;position:relative;padding-bottom:16px}
.steps li::before{content:"";position:absolute;left:70px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--red);z-index:1}
.steps li::after{content:"";position:absolute;left:75px;top:18px;bottom:-4px;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li:last-child{padding-bottom:0}
.st-t{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;padding-top:2px}
.st-b{padding-left:28px}
.st-b b{display:block;color:var(--ink);font-size:15.5px}
.st-b p{margin:3px 0 0;font-size:14.5px;line-height:1.5}
.c .st-b p{display:none}
.quote{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.q-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:18px 20px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.q-no{font-stretch:78%;font-weight:800;font-size:26px;color:var(--ink)}
.q-no small{display:block;font-stretch:100%;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--red-ink)}
.q-meta{font-size:13.5px;line-height:1.55;color:var(--text)}
.q-meta b{color:var(--ink)}
.quote .tbl-wrap{border:0;border-radius:0}
.q-tot{padding:12px 20px 16px;border-top:1px solid var(--line);display:grid;justify-content:end;gap:4px;font-variant-numeric:tabular-nums}
.q-tot div{display:grid;grid-template-columns:auto 150px;gap:18px;font-size:14px;text-align:right}
.q-tot .grand{font-size:20px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.q-notes{padding:0 20px 18px;font-size:13.5px;color:var(--muted);line-height:1.55}
.q-compact{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel-2)}
.q-compact .q-sum{text-align:right}
.q-compact .q-sum b{display:block;font-stretch:76%;font-size:28px;font-weight:800;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted);background:#fff}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.mail{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.mail-meta{padding:14px 18px;background:var(--panel-2);border-bottom:1px solid var(--line);display:grid;grid-template-columns:70px 1fr;gap:4px 12px;font-size:13.5px}
.mail-meta span{color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.mail-meta b{color:var(--ink)}
.mail-body{padding:16px 18px 18px;font-size:15px;line-height:1.6}
.mail-body p{margin:0 0 10px}
.mail-body p:last-child{margin:0}
.c .mail-body{font-size:14px;padding:12px 16px}
.chat{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#F4F2EE}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:14px}
.chat-head i{width:32px;height:32px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.chat-head b{color:var(--ink)}
.chat-head span{color:var(--muted);font-size:12.5px;display:block}
.chat-body{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;border-radius:14px;padding:9px 12px 7px;font-size:14.5px;line-height:1.5;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.06);color:var(--ink)}
.msg.r{align-self:flex-end;background:#FFE4E1}
.msg-n{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red-ink);margin-bottom:2px}
.msg-t{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:2px}
.check{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.check li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line-2);font-size:15px;line-height:1.45}
.check li:first-child{border-top:0}
.check i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--green-50);color:var(--green);margin-top:1px}
.check i .ic{width:14px;height:14px;stroke-width:2.6}
.check li.warn i{background:var(--amber-50);color:var(--amber)}
.check li.todo i{background:var(--panel-2);color:var(--faint);border:1px solid var(--line)}
.c .check li{font-size:14px;padding:6px 0}
.callout{border-left:4px solid var(--red);background:var(--red-50);border-radius:0 14px 14px 0;padding:14px 18px}
.callout b{display:block;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--red-ink);margin-bottom:6px}
.callout p{margin:0;font-size:15px;line-height:1.55;color:var(--ink)}
.callout.dark{background:var(--dark);border-color:var(--red);color:#fff}
.callout.dark b{color:var(--red-on-dark)}
.callout.dark p{color:#fff}
.callout.grey{background:var(--panel-2);border-color:var(--text)}
.callout.grey b{color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.split>div{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel-2)}
.split>div.after{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px var(--red-50)}
.split h5{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.split .after h5{color:var(--red-ink)}
.split strong{display:block;color:var(--ink);font-size:16px;line-height:1.35;margin-bottom:6px}
.split p{margin:0;font-size:14.5px;line-height:1.55}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.b-col{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px}
.b-col h5{margin:2px 4px 10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.b-col h5 em{font-style:normal;color:var(--ink)}
.b-item{background:#fff;border:1px solid var(--line);border-left:3px solid var(--text);border-radius:10px;padding:9px 10px;margin-top:8px;font-size:13px;line-height:1.4}
.b-item b{display:block;color:var(--ink);font-size:13.5px}
.b-item span{color:var(--muted)}
.b-item.red{border-left-color:var(--red)}
.b-item.good{border-left-color:var(--green)}
.b-item.warn{border-left-color:#E0A000}
.gantt{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.g-row{display:grid;grid-template-columns:150px 1fr;border-top:1px solid var(--line-2)}
.g-row:first-child{border-top:0}
.g-l{padding:10px 12px;font-size:13px;font-weight:700;color:var(--ink);background:var(--panel-2);border-right:1px solid var(--line-2);line-height:1.3}
.g-l small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.g-track{position:relative;min-height:48px;background-image:linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:var(--tick) 100%}
.g-blk{position:absolute;top:7px;bottom:7px;border-radius:8px;background:var(--text);color:#fff;font-size:11.5px;line-height:1.2;padding:5px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.g-blk.red{background:var(--red)}
.g-blk.warn{background:repeating-linear-gradient(45deg,#F6C04E 0 6px,#F2B230 6px 12px);color:#3a2a00}
.g-blk.muted{background:#CFCFCF;color:#333}
.g-blk.pin{background:none;color:var(--ink);overflow:visible;padding:5px 0 0 16px;font-weight:700}
.g-blk.pin::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;background:var(--text)}
.g-blk.pin.red::before{background:var(--red)}
.g-blk.pin.red{color:var(--red-ink)}
.g-hours span:last-child{transform:translateX(-100%)}
.g-hours span:first-child{transform:none}
.g-hours{display:grid;grid-template-columns:150px 1fr;background:var(--panel-2);border-bottom:1px solid var(--line)}
.g-hours div:last-child{position:relative;height:26px}
.g-hours span{position:absolute;top:6px;font-size:11px;font-weight:700;color:var(--muted);transform:translateX(-50%)}
.c .g-row{grid-template-columns:100px 1fr}
.c .g-hours{grid-template-columns:100px 1fr}
.c .g-l small{display:none}
.cuts{display:grid;gap:18px}
.cut-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.cut-head b{font-size:14px;color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.cut-head span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cut-head span strong{color:var(--red-ink)}
.cut-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-top:6px;background:#fff}
.cut-seg{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#fff;border-right:2px solid #fff;overflow:hidden;white-space:nowrap;min-width:0}
.cut-seg.o1{background:#484848}
.cut-seg.o2{background:#7A7A7A}
.cut-seg.o3{background:#5B6773}
.cut-seg.o4{background:#A9A9A9;color:#1f1f1f}
.cut-seg.o5{background:#2A2A2A}
.cut-seg.scrap{background:var(--red)}
.cut-seg.rem{background:repeating-linear-gradient(45deg,#EFEFEF 0 6px,#DADADA 6px 12px);color:#333;border-right:0}
.cut-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.cut-leg span{display:inline-flex;align-items:center;gap:6px}
.cut-leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.wcalc{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--panel-2)}
.wcalc-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
@media (max-width:560px){.wcalc-grid{grid-template-columns:1fr 1fr}.wcalc-grid label:first-child{grid-column:1/-1}}
.wcalc label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wcalc select,.wcalc input{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);text-transform:none;letter-spacing:0;width:100%}
.wcalc-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.wcalc-out div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.wcalc-out b{display:block;font-stretch:76%;font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.wcalc-out span{font-size:12px;color:var(--muted)}
.wcalc-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.spark{border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px;background:#fff}
.spark-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.spark-top b{font-size:14px;color:var(--ink)}
.spark-top span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.spark-top span strong{color:var(--green)}
.spark svg{display:block;width:100%;height:auto;margin-top:6px}
.browser{border:1px solid #D5D5D5;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 26px rgba(0,0,0,.08)}
.br-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#F1F1F1;border-bottom:1px solid #DDD}
.br-bar i{width:10px;height:10px;border-radius:50%;background:#D0D0D0;display:inline-block}
.br-url{flex:1;margin-left:8px;background:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-in{display:grid;grid-template-columns:170px 1fr}
.br-nav{background:var(--dark);color:#fff;padding:16px 10px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.br-nav .br-logo{font-weight:800;font-size:15px;padding:0 8px 12px;letter-spacing:.02em}
.br-nav span{padding:8px 10px;border-radius:8px;color:#D8D8D8}
.br-nav span.on{background:var(--red);color:#fff;font-weight:700}
.br-main{padding:16px;min-width:0}
.br-main h4{margin:0 0 12px;font-size:18px;color:var(--ink)}
@media (max-width:620px){.br-in{grid-template-columns:1fr}.br-nav{flex-direction:row;flex-wrap:wrap}.br-nav .br-logo{width:100%;padding-bottom:4px}}
.c .br-in{grid-template-columns:110px 1fr}
.c .br-nav{font-size:12px}
.phone{width:320px;max-width:100%;margin:0 auto;border:10px solid #1f1f1f;border-radius:38px;overflow:hidden;background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.18)}
.ph-top{background:var(--dark);color:#fff;padding:18px 16px 12px;font-size:13px}
.ph-top b{display:block;font-size:17px;margin-top:2px}
.ph-in{padding:12px}
.c .phone{width:250px;border-width:7px;border-radius:30px}

/* ---------- Menu drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:60}
.drawer{position:fixed;z-index:61;top:calc(12px + var(--sat));left:12px;bottom:calc(12px + var(--sab));width:min(380px,calc(100vw - 24px));background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px 22px;border-bottom:1px solid var(--line)}
.dr-head b{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.dr-body{overflow:auto;padding:10px 12px 16px;flex:1}
.dr-sec{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.dr-item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px}
.dr-item:hover{background:var(--panel-2)}
.dr-item .n{min-width:40px;padding:0 6px;height:40px;border-radius:12px;border:2px solid var(--red);display:grid;place-items:center;font-weight:800;color:var(--red-ink);font-size:15px}
.dr-item b{display:block;font-size:15px;color:var(--ink);line-height:1.2}
.dr-item span{font-size:13px;color:var(--muted)}
.dr-foot{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--panel-2)}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab))}
.modal[hidden],.drawer[hidden],.scrim[hidden]{display:none}
.m-back{position:absolute;inset:0;background:rgba(20,20,20,.55)}
.m-panel{position:relative;width:min(1040px,100%);max-height:100%;background:#fff;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:mIn .22s ease-out}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.m-scroll{overflow:auto;overscroll-behavior:contain}
.m-head{padding:30px 36px 22px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.m-close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;z-index:2}
.m-close:hover{border-color:var(--ink)}
.m-title{font-size:34px;line-height:1.1;font-weight:800;color:var(--ink);margin:12px 60px 8px 0}
.m-desc{font-size:17px;line-height:1.5;margin:0;max-width:820px}
.m-body{padding:26px 36px 30px;font-size:15px}
.m-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:#fff}
.m-foot button{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink);max-width:48%;text-align:left}
.m-foot button:hover{border-color:var(--ink)}
.m-foot button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-foot button:disabled{visibility:hidden}
@media (max-width:640px){.modal{padding:var(--sat) 0 var(--sab);align-items:stretch}.m-panel{max-height:100%;border-radius:0}.m-head{padding:22px 18px 16px}.m-body{padding:20px 16px 24px}.m-title{font-size:25px}}
/* Nápověda: plovoucí karta, nezakrývá mapu */
.guide-card{position:fixed;z-index:45;left:12px;bottom:calc(64px + var(--sab));width:min(400px,calc(100% - 24px));background:var(--dark);color:#fff;border-radius:20px;padding:20px 20px 18px;box-shadow:0 18px 44px rgba(0,0,0,.28);animation:mIn .22s ease-out}
.guide-card .kicker{color:var(--red-on-dark);margin-bottom:6px;font-size:11px}
.guide-card h2{font-size:21px;margin:0 40px 6px 0;color:#fff;font-weight:800;line-height:1.2}
.guide-card p{font-size:14px;line-height:1.5;color:var(--on-dark-muted);margin:0}
.g-list{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.g-list li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;background:var(--dark-2);border-radius:12px;padding:8px 10px;font-size:14px;color:#EDEDED}
.g-list i{width:36px;height:36px;border-radius:10px;background:var(--dark-3);display:grid;place-items:center;color:var(--red-on-dark)}
.g-list b{color:#fff}
.g-list span{display:block;font-size:12.5px;color:var(--on-dark-muted)}
.guide-card .btn-red{width:100%;justify-content:center;padding:12px}
.gc-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--dark-2)}
.gc-close:hover{background:var(--dark-line)}
body.linear .guide-card{display:none}
.hint{transition:background .3s,color .3s,border-color .3s}
.hint.hi{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:0 10px 28px rgba(0,0,0,.25)}
.hint.hi::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:10px;vertical-align:1px;animation:pulse 2s infinite}
/* Kontakt: adresa jako text ke zkopírování (odkaz mailto nemusí všude fungovat) */
.contact .m-panel{width:min(580px,100%)}
.ct-in{padding:34px 34px 30px;overflow:auto}
.ct-title{font-size:30px;line-height:1.12;font-weight:800;color:var(--ink);margin:4px 48px 10px 0;text-wrap:balance}
.ct-text{font-size:16px;line-height:1.55;margin:0 0 20px;color:var(--text);max-width:60ch}
.ct-rows{display:grid;gap:8px}
.ct-row{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;background:var(--panel-2)}
.ct-k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ct-v{font-size:17px;font-weight:700;color:var(--ink);user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.ct-v a{color:var(--red-ink)}
.ct-copy{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.ct-copy:hover{border-color:var(--ink)}
.ct-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:20px}
.ct-note{font-size:13px;color:var(--muted);line-height:1.45;flex:1;min-width:200px}
.ct-addr{font-size:13px;color:var(--muted);margin-top:16px}
@media (max-width:480px){.ct-row{grid-template-columns:minmax(0,1fr) auto}.ct-k{grid-column:1/-1}.ct-in{padding:24px 18px}.ct-title{font-size:25px}}
.err{max-width:640px;margin:120px auto;background:#fff;border-radius:22px;padding:32px;border:1px solid var(--line);font-size:16px;line-height:1.5}

/* ---------- Vstupy klienta, výběr boosterů, cena ---------- */
.btn:disabled{opacity:.6;cursor:wait}
.btn .ic{width:18px;height:18px}
.inputs{margin-top:30px;border:1px solid var(--red-100);border-radius:22px;background:var(--red-50)}
.inputs-toggle{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px 20px;border-radius:22px}
.inputs-toggle>i{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.inputs-toggle>span{flex:1;min-width:0}
.inputs-toggle b{display:block;font-size:19px;color:var(--ink);line-height:1.25}
.inputs-toggle>span>span{display:block;font-size:14.5px;color:var(--text);margin-top:3px;line-height:1.4}
.inputs-toggle .chev{color:var(--ink);transition:transform .2s}
.inputs-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.inp-count{font-style:normal;font-size:12px;font-weight:800;background:var(--green);color:#fff;border-radius:999px;padding:5px 11px;white-space:nowrap}
.inp-count[hidden]{display:none}
.inputs-body{padding:4px 20px 22px;display:grid;gap:22px}
body:not(.linear) .inputs-body{grid-template-columns:minmax(0,1fr) 540px;gap:30px;align-items:start}
.inputs-body[hidden]{display:none}
.inp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
body:not(.linear) .inp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.inp{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.inp-l{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.inp-row{display:flex;align-items:center;gap:8px}
.inp input,.okpi input{font:inherit;color:var(--ink);width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.inp input{font-size:21px;font-weight:800;padding:7px 10px;font-variant-numeric:tabular-nums}
.inp input:focus,.okpi input:focus,.prio textarea:focus,.pick-wish textarea:focus{outline:none;border-color:var(--red);background:#fff;box-shadow:0 0 0 3px var(--red-100)}
.inp input.bad{border-color:var(--red-ink);background:var(--red-50)}
.inp-u{font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.inp-src{align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:#EFEFEF;color:#4A4A4A}
.inp-src.est{background:var(--amber-50);color:var(--amber)}
.inp-src.own{background:var(--green-50);color:var(--green)}
.explain-h{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--red-ink);margin:0 0 10px}
.explain-h[hidden],.explain[hidden]{display:none}
.explain{display:grid;gap:6px;font-size:14.5px;line-height:1.5;color:var(--text)}
.explain div{background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px}
.explain strong{color:var(--ink)}
.okpis{margin-top:20px}
.inp-hint{font-size:14px;line-height:1.5;color:var(--text);margin:0 0 10px}
.okpi{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.okpi input{font-size:15px;padding:9px 10px}
.okpi-del{width:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.okpi-del:hover{border-color:var(--ink);color:var(--ink)}
@media (max-width:620px){.okpi{grid-template-columns:repeat(3,minmax(0,1fr)) auto}.okpi input[data-f="name"]{grid-column:1/-1}}
.inp-actions{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.inp-actions[hidden],[data-kpi-add][hidden]{display:none}
.save-status{font-size:13.5px;color:var(--muted);line-height:1.4}
.save-status.ok{color:var(--green);font-weight:700}
.save-status.fail{color:var(--red-ink);font-weight:700}
.inp-note{font-size:12.5px;color:var(--muted);margin:12px 0 0;line-height:1.45}
.area-meas{font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.area-meas b{color:var(--green)}
.area-meas:empty{display:none}
.card-flags{margin-left:auto;display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.card-flags:empty,.card-flags>span:empty{display:none}
.card-meta .pill{text-transform:none;letter-spacing:0;font-size:11.5px}
.m-head .card-meta{flex-wrap:wrap;padding-right:48px}
.prio{margin-top:16px;max-width:820px;display:grid;gap:10px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.prio-top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.prio-l{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.prio-btns{display:inline-flex;gap:6px;flex-wrap:wrap}
.prio-btns button{border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--ink);background:#fff}
.prio-btns button:hover{border-color:var(--ink)}
.prio-btns button[data-prio="yes"][aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.prio-btns button[data-prio="maybe"][aria-pressed="true"]{background:#F2B230;border-color:#F2B230;color:#2b1f00}
.prio-btns button[data-prio="no"][aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#fff}
.prio textarea,.pick-wish textarea{font:inherit;font-size:14.5px;line-height:1.45;border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;width:100%;color:var(--ink);background:var(--panel-2)}
.pick{margin-top:26px;border:1px solid var(--line);border-radius:22px;padding:24px 26px;background:#fff}
body.linear .pick{padding:18px}
.pick-head{display:flex;align-items:baseline;gap:8px 14px;flex-wrap:wrap}
.pick-head h3{font-size:26px;margin:0;color:var(--ink);font-weight:800;line-height:1.15}
.pick-count{font-size:14px;font-weight:800;color:var(--green)}
.pick-lead{font-size:15.5px;line-height:1.5;margin:8px 0 0;max-width:900px}
.pick-grp{margin-top:16px}
.pick-grp h4{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.pick-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px}
.pick-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2)}
.pick-item:hover{border-color:var(--red);background:#fff}
.pick-t{font-weight:700;color:var(--ink);font-size:15px;line-height:1.3}
.pick-t small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-wk{font-size:12px;color:var(--muted);white-space:nowrap}
.pick-no{font-size:13.5px;color:var(--muted);margin:12px 0 0;line-height:1.5}
.pick-empty{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;background:var(--panel-2);border:1px dashed #CFCFCF;border-radius:14px;padding:14px 16px}
.pick-empty p{margin:0;font-size:15px;line-height:1.5;flex:1;min-width:240px}
.pick-wish{display:grid;gap:6px;margin-top:18px;font-size:14.5px;color:var(--text)}
.pricing{margin-top:26px;border-radius:22px;background:var(--dark);color:#fff;padding:30px 32px}
body.linear .pricing{padding:22px 18px}
.pricing .kicker{color:var(--red-on-dark);margin-bottom:10px}
.pricing h3{font-size:32px;margin:0;color:#fff;font-weight:800;line-height:1.12}
body.linear .pricing h3{font-size:25px}
.pr-lead{font-size:16px;line-height:1.5;color:var(--on-dark-muted);margin:10px 0 0;max-width:920px}
.pr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:24px;margin-top:24px;align-items:start}
body:not(.linear) .pr-grid{grid-template-columns:620px minmax(0,1fr);gap:34px}
.pr-grid>*{min-width:0}
.pr-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pr-presets button{border:1px solid var(--dark-line);border-radius:14px;padding:12px 14px;text-align:left;background:var(--dark-2);color:#fff}
.pr-presets button:hover{border-color:#8a8a8a}
.pr-presets button b{display:block;font-size:16px}
.pr-presets button span{font-size:13px;color:var(--on-dark-muted)}
.pr-presets button[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 3px rgba(250,43,43,.3)}
.pr-slider{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:22px;font-size:14px;color:var(--on-dark-muted)}
.pr-slider b{font-stretch:76%;font-size:34px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.pr-scale{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--on-dark-muted)}
.pr-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
.pr-tiles div{background:var(--dark-2);border-radius:14px;padding:12px 14px}
.pr-tiles b{display:block;font-stretch:76%;font-size:27px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}
.pr-tiles span{display:block;font-size:12.5px;color:var(--on-dark-muted);line-height:1.35;margin-top:3px}
.pr-rules{margin:14px 0 0;padding:0 0 0 18px;font-size:13.5px;line-height:1.55;color:var(--on-dark-muted)}
.pr-rules li+li{margin-top:4px}
.pricing .inp-actions{margin-top:20px}
.pricing .save-status{color:var(--on-dark-muted)}
.pricing .save-status.ok{color:#7BD8AE}
.pricing .save-status.fail{color:var(--red-on-dark)}
.savebar{position:fixed;z-index:50;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100% - 150px);background:var(--dark);color:#fff;border-radius:999px;padding:7px 7px 7px 20px;box-shadow:0 12px 32px rgba(0,0,0,.28);font-size:14px;font-weight:700;animation:mIn .2s ease-out}
.savebar[hidden]{display:none}
.savebar .btn{padding:10px 16px;font-size:14px;box-shadow:none}
.savebar .btn[hidden]{display:none}
.hint.under,.modelbadge.under{visibility:hidden}
@media (max-width:560px){
  .savebar{left:12px;right:72px;transform:none;max-width:none;border-radius:18px;padding:8px 8px 8px 14px;gap:10px;font-size:13px}
  .inputs-toggle{display:grid;grid-template-columns:40px minmax(0,1fr) 22px;align-items:start;gap:8px 12px;padding:14px}
  .inputs-toggle>i{width:40px;height:40px;grid-row:1/3}
  .inputs-toggle>span{grid-column:2;grid-row:1}
  .inputs-toggle .inp-count{grid-column:2;grid-row:2;justify-self:start}
  .inputs-toggle .chev{grid-column:3;grid-row:1;margin-top:2px}
  .inputs-toggle b{font-size:17px}
  .inputs-body{padding:4px 12px 16px}
  .pr-presets{gap:6px}
  .pr-presets button{padding:10px}
  .pr-presets button b{font-size:14px}
  .pr-tiles b{font-size:22px}
}
@media print{.savebar,.inputs-toggle .chev{display:none!important}}

/* ---------- Úzké obrazovky ---------- */
@media (max-width:820px){
  .topbar{height:56px;gap:12px;padding:0 8px 0 14px;top:calc(8px + var(--sat));left:8px;right:8px}
  .tb-copy{display:none}
  .tb-client{padding-left:12px;gap:6px}
  .tb-client img{height:22px;max-width:110px}
  .brand svg{height:24px}
  .topbar .btn-red{padding:10px 12px;font-size:13.5px}
}
.cta-short{display:none}
@media (max-width:560px){.topbar .cta-long{display:none}.topbar .cta-short{display:inline}.tb-client span{display:none}}
@media (max-width:380px){.tb-client{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body{overflow:visible}
  .topbar,.fab,.zoomctl,.hint,.modelbadge{display:none!important}
}

  document.fonts?.ready.then(() => { if (!isLinear() && !interacted) { computeMin(); go(startKey(), false); } });
  // přímý odkaz na kartu: index.html#k-3.1

}

/* ============ Harmonogram: délky fází a volitelné moduly ============ */
// fáze = pruh s kartami; len = počet týdnů; optional = modul, který si klient může přidat (posune další fáze)
const modState = {};
let sched = {}, totalWeeks = 0;
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4) ? few : many;
const rangeLabel = (a, b) => a === b ? 'Týden ' + a : 'Týdny ' + a + '–' + b;
const monthsOf = w => Math.round(w / 4.33 * 2) / 2;
function computeSchedule() {
  let start = 1; sched = {};
  C.weeks.forEach(w => {
    const len = w.len || 1, on = !w.optional || !!modState[w.n];
    sched[w.n] = on ? { on, len, from: start, to: start + len - 1 } : { on, len };
    if (on) start += len;
  });
  totalWeeks = start - 1;
}
function wkLabel(n, f = 'long') {
  const s = sched[n]; if (!s) return '';
  if (!s.on) return f === 'big' ? '+' + s.len : 'Volitelně · +' + s.len + ' ' + plural(s.len, 'týden', 'týdny', 'týdnů');
  const r = s.from === s.to ? String(s.from) : s.from + '–' + s.to;
  return f === 'big' ? r : rangeLabel(s.from, s.to);
}
function durLabel(w) {
  const m = monthsOf(w);
  if (m < 2) return w + ' ' + plural(w, 'týden', 'týdny', 'týdnů');
  return Number.isInteger(m) ? m + ' ' + plural(m, 'měsíc', 'měsíce', 'měsíců') : fmt(m, 1) + ' měsíce';
}
function fillDyn(t) {
  return String(t ?? '').replace(/\{dur\}/g, durLabel(totalWeeks)).replace(/\{weeks\}/g, totalWeeks + ' ' + plural(totalWeeks, 'týden', 'týdny', 'týdnů')).replace(/\{T\}/g, String(totalWeeks));
}
function setModule(n, on) {
  modState[n] = on;
  C.calc.areas.forEach((a, i) => { if (a.module === n) calcState.on[i] = on; });
  applySchedule(); updateCalc(); updatePricing(); markDirty();
}
function applySchedule() {
  computeSchedule();
  $$('[data-wk]').forEach(el => { el.textContent = wkLabel(+el.dataset.wk, el.dataset.wkf || 'long'); });
  $$('[data-dyn]').forEach(el => { el.textContent = fillDyn(el.dataset.dyn); });
  $$('[data-colwk]').forEach(el => {
    const ns = el.dataset.colwk.split(',').filter(Boolean).map(Number); if (!ns.length) return;
    const on = ns.map(n => sched[n]).filter(x => x && x.on);
    const len = ns.reduce((a, n) => a + (sched[n]?.len || 0), 0);
    el.textContent = on.length ? rangeLabel(Math.min(...on.map(x => x.from)), Math.max(...on.map(x => x.to))) : 'Volitelně · +' + len + ' ' + plural(len, 'týden', 'týdny', 'týdnů');
  });
  $$('.lane').forEach(l => l.classList.toggle('off', !sched[+l.dataset.n]?.on));
  $$('[data-mod]').forEach(sw => { const on = !!modState[+sw.dataset.mod]; sw.setAttribute('aria-checked', String(on)); const t = sw.querySelector('.sw-t'); if (t) t.textContent = on ? 'V PROGRAMU' : 'PŘIDAT'; });
  renderTimeline();
}
function renderTimeline() {
  const tl = $('#tl'); if (!tl) return;
  const D = C.needs, on = C.weeks.filter(w => sched[w.n]?.on), m = monthsOf(totalWeeks);
  tl.style.gridTemplateColumns = on.map(w => (w.len || 1) + 'fr').join(' ');
  tl.innerHTML = on.map(w => '<div class="tl-seg' + (w.optional ? ' opt' : '') + '"><b>' + esc(wkLabel(w.n)) + '</b><span>' + esc(w.short) + '</span></div>').join('');
  $('#tlAfter').innerHTML = '<span><b>' + rangeLabel(1, totalWeeks) + '</b> · ' + esc(D.during || 'nasazení a ladění s konzultanty') + '</span><span><b>Měsíce ' + (Math.floor(m) + 1) + '–12</b> · ' + esc(D.after) + '</span>';
  $('#tlMods').innerHTML = C.weeks.filter(w => w.optional).map(w => {
    const onM = !!modState[w.n];
    return '<div class="mod-row' + (onM ? ' on' : '') + '"><button class="switch" type="button" role="switch" aria-checked="' + onM + '" data-mod="' + w.n + '" aria-label="' + esc('Zahrnout do programu: ' + w.short) + '"><span class="sw-t">' + (onM ? 'V PROGRAMU' : 'PŘIDAT') + '</span><span class="knob"></span></button>' +
      '<div><b>' + esc((w.optionalLabel || 'Volitelný modul: ' + w.short) + ' · +' + w.len + ' ' + plural(w.len, 'týden', 'týdny', 'týdnů')) + '</b><span class="t">' + esc(w.optionalText || '') + '</span></div></div>';
  }).join('');
}

function initFeed() {
  const list = $('#feedList'); if (!list) return;
  const items = C.hero.feed; let i = 0, clock = C.hero.feedStart || 420;
  const add = (animate) => {
    const it = items[i % items.length]; i++;
    clock += 3 + ((i * 5) % 7);
    const hh = String(Math.floor(clock / 60) % 24).padStart(2, '0'), mm = String(clock % 60).padStart(2, '0');
    const li = document.createElement('li');
    if (animate) li.className = 'new';
    li.innerHTML = '<span class="feed-time">' + hh + ':' + mm + '</span><span><span class="feed-agent">' + esc(C.agents[it.agent].name) + '</span>' + esc(it.text) + '</span>';
    list.prepend(li);
    while (list.children.length > 5) list.lastElementChild.remove();
  };
  for (let k = 0; k < 5; k++) add(false);
  if (!reduced) setInterval(() => { if (!document.hidden) add(true); }, 3400);
}

const calcState = { cur: 'czk', on: [], x: [] };
function model(xs) {

  C.calc.areas.forEach((a, i) => {
    const x = xs[i] || 0;
    if (a.lever === 'margin') gm *= (1 + x);
    else if (a.lever === 'demand' || a.lever === 'conversion') rev *= (1 + x);
    else if (a.lever === 'waste') save += b.wastePct * x * b.processedTons * 10 * (b.pricePerKg - b.scrapPerKg);
    else if (a.lever === 'overhead') fixed -= b.adminCosts * x;
    else if (a.lever === 'revenue') rev *= (1 + x);

}

}

function updateCalc() {

    el.querySelector('[data-ms]').textContent = sub || '';

  });

function metric(a, x, xs) {
  const b = C.calc.base;

function waterfall(base, steps, total, tgt) {

  const maxV = Math.max(tgt, total, base) * 1.1;

  const cur = calcState.cur === 'eur' ? C.calc.eurRate : 1;
  const short = v => fmt(v / cur / 1e6, 1);
  let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Most zisku: dnes, přínos jednotlivých oblastí a nový zisk">';
  out += '<line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#DADADA"/>';
  const bar = (i, v0, v1, fill, lbl, val, strong) => {
    const x = pl + slot * i + (slot - bw) / 2, top = y(Math.max(v0, v1)), h = Math.max(1.5, Math.abs(y(v0) - y(v1)));
    out += '<rect x="' + x + '" y="' + top + '" width="' + bw + '" height="' + h + '" rx="4" fill="' + fill + '"/>';
    out += '<text x="' + (x + bw / 2) + '" y="' + (top - 7) + '" text-anchor="middle" font-size="12.5" font-weight="' + (strong ? 800 : 700) + '" fill="#232323" font-family="Archivo,Arial">' + val + '</text>';
    out += '<text x="' + (x + bw / 2) + '" y="' + (H - pb + 18) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6B6B6B" font-family="Archivo,Arial">' + esc(lbl) + '</text>';
    if (i < n - 1) { const nx = pl + slot * (i + 1) + (slot - bw) / 2; out += '<line x1="' + (x + bw) + '" x2="' + nx + '" y1="' + y(v1) + '" y2="' + y(v1) + '" stroke="#BDBDBD" stroke-dasharray="3 3"/>'; }
  };

  steps.forEach((s, i) => { bar(i + 1, acc, acc + s.v, s.v > 0.5 ? '#FA2B2B' : '#E2E2E2', s.l, s.v > 0.5 ? '+' + short(s.v) : '0', false); acc += s.v; });

  out += '<text x="' + (W - 4) + '" y="' + (y(tgt) - 6) + '" text-anchor="end" font-size="11.5" font-weight="800" fill="#232323" font-family="Archivo,Arial">CÍL ' + short(tgt) + '</text>';
  out += '<text x="4" y="14" font-size="11" font-weight="800" fill="#6B6B6B" letter-spacing="1" font-family="Archivo,Arial">ZISK ROČNĚ · MIL. ' + (calcState.cur === 'eur' ? '€' : 'KČ') + '</text>';
  return out + '</svg>';
}

function cell(v) {
  if (v && typeof v === 'object') return '<span class="pill ' + esc(v.tone || 'info') + '">' + esc(v.t) + '</span>';

  if (s.startsWith('✓ ')) return '<span class="pill ok">' + esc(s) + '</span>';
  if (s.startsWith('! ')) return '<span class="pill warn">' + esc(s.slice(2)) + '</span>';

let uid = 0;
const R = {

  },
  callout(b) { return '<div class="callout ' + (b.tone || '') + '">' + (b.label ? '<b>' + esc(b.label) + '</b>' : '') + '<p>' + rich(b.text) + '</p></div>'; },
  split(b) {
    return '<div class="split">' + [['', b.before], ['after', b.after]].map(([k, s]) => '<div class="' + k + '"><h5>' + esc(s.label) + '</h5>' + (s.head ? '<strong>' + esc(s.head) + '</strong>' : '') + [].concat(s.text || []).map(p => '<p>' + rich(p) + '</p>').join('') + '</div>').join('') + '</div>';

  },
  gantt(b, c) {
    const [h0, h1] = b.hours, span = h1 - h0, tp = v => { const [h, m] = String(v).split(':').map(Number); return ((h + (m || 0) / 60) - h0) / span * 100; };

        r.blocks.map(k => { const l = tp(k.from), w = tp(k.to) - l; return '<div class="g-blk ' + (k.tone || '') + (k.pin ? ' pin' : '') + '" style="left:calc(' + l + '% + 2px);width:calc(' + w + '% - 4px)" title="' + esc(k.from + '–' + k.to + ' · ' + k.label) + '">' + esc(k.label) + '</div>'; }).join('') +
