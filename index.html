<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nabídky XpertDigital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#FA2B2B;--ink:#232323;--text:#484848;--muted:#6B6B6B;--bg:#ECECEC;--line:#E2E2E2}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:grid;place-items:center;padding-inline:16px}
main{background:#fff;border:1px solid var(--line);border-radius:24px;padding:40px 36px;max-width:520px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.07)}
.k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#D31414}
h1{font-size:30px;line-height:1.15;color:var(--ink);margin:10px 0 12px}
p{font-size:16px;line-height:1.55;margin:0 0 18px}
dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:0;font-size:16px}
dt{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dd{margin:0;color:var(--ink);font-weight:700}
a{color:#D31414}
</style>
</head>
<body>
<main>
  <div class="k">XpertDigital</div>
  <h1>Osobní nabídky pro naše klienty</h1>
  <p>Každá nabídka má vlastní odkaz. Pokud jste ho od nás dostali, otevřete ho prosím celý, včetně části za lomítkem.</p>
  <dl>
    <dt>Kontakt</dt><dd>Tomáš Knížek</dd>
    <dt>Telefon</dt><dd>+420 733 590 059</dd>
    <dt>E-mail</dt><dd>sales@xpertdigital.com</dd>
    <dt>Web</dt><dd><a href="https://xpertdigital.com" target="_blank" rel="noopener">xpertdigital.com</a></dd>
  </dl>
</main>
</body>
</html>
