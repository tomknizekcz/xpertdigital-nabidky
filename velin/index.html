<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velín nabídek</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
/* Velín nabídek · konzole XpertDigital. Vzhled podle prototypu, světlý i tmavý režim. */
:root{
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;
  --bg:#F1F1EE; --panel:#FFFFFF; --panel-2:#F8F8F5; --sunk:#EDEDE9; --app:#F6F6F3;
  --ink:#1D1D1C; --text:#444442; --muted:#686864; --faint:#8E8E89;
  --line:#E0E0DB; --line-2:#ECECE7;
  --red:#FA2B2B; --red-ink:#C51313; --red-50:#FFF0EF; --red-100:#FFD9D6; --red-btn:#E52020; --red-btn-h:#C81818;
  --green:#127250; --green-50:#E3F3EA; --amber:#8A5700; --amber-50:#FFF1D2; --blue:#1C5CAB; --blue-50:#E6EFFA;
  --chip:#ECECE8; --chip-ink:#474744;
  --rail:#292928; --rail-2:#383837; --rail-line:#4A4A48; --on-rail:#FFFFFF; --on-rail-muted:#BDBDB7;
  --bar:#3C3C3A; --track:#E8E8E3; --axis:#C4C4BE; --warm:#E09A00;
  --h0:#EAEAE5; --h1:#FDD3CF; --h2:#F7A099; --h3:#EE5F57; --h4:#CC1C1C;
  --s-yes:#15805A; --s-maybe:#EFB02E; --s-no:#7A7A75; --warm-bar:#E09A00;
  --shadow:0 1px 2px rgba(25,25,20,.04),0 14px 34px rgba(25,25,20,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#131312; --panel:#1C1C1B; --panel-2:#222221; --sunk:#2A2A28; --app:#171716;
    --ink:#F2F2EE; --text:#D2D2CD; --muted:#A2A29C; --faint:#7C7C77;
    --line:#343432; --line-2:#2A2A28;
    --red:#FF4545; --red-ink:#FF7C74; --red-50:#3B1715; --red-100:#5A201C; --red-btn:#E52020; --red-btn-h:#FF3A3A;
    --green:#4CC592; --green-50:#15301F; --amber:#EDB24D; --amber-50:#33280E; --blue:#86B4F0; --blue-50:#17273C;
    --chip:#2C2C2A; --chip-ink:#D0D0CA;
    --rail:#0C0C0B; --rail-2:#222221; --rail-line:#383836; --on-rail:#FFFFFF; --on-rail-muted:#A6A6A0;
    --bar:#D4D4CE; --track:#2E2E2C; --axis:#4A4A47; --warm:#EDB24D;
    --h0:#262624; --h1:#4B1D1A; --h2:#7F2621; --h3:#C0322A; --h4:#FF5A4F;
    --s-yes:#2FA878; --s-maybe:#D9A23A; --s-no:#6F6F6A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.35);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--app);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{margin:0;color:var(--ink)}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--on-rail);padding:18px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.rail-brand .mark{width:32px;height:32px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none}
.rail-brand b{display:block;font-stretch:80%;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.03em;line-height:1.1}
.rail-brand span{display:block;font-size:11.5px;color:var(--on-rail-muted)}
.rnav{display:flex;flex-direction:column;gap:2px}
.rnav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--on-rail-muted);text-align:left;white-space:nowrap}
.rnav button:hover,.rnav button[aria-current="page"]{background:var(--rail-2);color:var(--on-rail)}
.rnav button[aria-current="page"] .ic{color:var(--red)}
.rnav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--rail-line);border-radius:999px;padding:0 7px;color:var(--on-rail)}
.rnav .cnt.hot{background:var(--red-btn);color:#fff}
.rail-h{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--on-rail-muted);padding:0 10px;margin-bottom:6px}
.rshort button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--on-rail-muted);text-align:left}
.rshort button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rshort button:hover,.rshort button[aria-current="page"]{background:var(--rail-2);color:var(--on-rail)}
.rshort em{margin-left:auto;font-style:normal;font-size:11.5px;white-space:nowrap}
.rail-foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--on-rail-muted);padding:10px;border:1px dashed var(--rail-line);border-radius:10px;line-height:1.4}
.rail-foot button,.rail-foot a{color:var(--on-rail);font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.rail-foot .ic{width:15px;height:15px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
.dot.live{background:var(--red);box-shadow:0 0 0 3px rgba(250,43,43,.25)}
.dot.act{background:var(--warm)}
.dot.ok{background:var(--green)}
.main{padding:24px 28px 40px;min-width:0;max-width:1320px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 12px;overflow-x:auto}
  .rail-brand span,.rshort,.rail-foot .note{display:none}
  .rnav{flex-direction:row}
  .rail-foot{margin:0 0 0 auto;border:0;padding:0;display:flex;flex:none}
  .main{padding:18px 16px 30px}
}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.vh h3{font-size:28px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.005em;line-height:1}
.vh h3:focus{outline:none}
.vh p{font-size:13.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h4{font-size:15.5px;font-weight:700}
.ph span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.mt{margin-top:14px}
@media (max-width:900px){.g2,.g2e{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:27px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spark{width:120px;height:28px;display:block;margin-top:4px}
.sp-l{fill:none;stroke:var(--bar);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-a{fill:var(--bar);opacity:.1}
.sp-d{fill:var(--red);stroke:var(--panel);stroke-width:2}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.6;background:var(--chip);color:var(--chip-ink)}
.chip .ic{width:13px;height:13px}
.chip.hot,.chip.bad{background:var(--red-50);color:var(--red-ink)}
.chip.warm{background:var(--amber-50);color:var(--amber)}
.chip.cold{background:var(--blue-50);color:var(--blue)}
.chip.ok{background:var(--green-50);color:var(--green)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip.dark{background:var(--ink);color:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;font-weight:700;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.red{background:var(--red-btn);border-color:var(--red-btn);color:#fff}
.btn.red:hover{background:var(--red-btn-h);border-color:var(--red-btn-h)}
.btn .ic{width:15px;height:15px}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{font-size:13px;font-weight:700;color:var(--red-ink);display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.lnk .ic{width:15px;height:15px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink);flex:none}
.av.big{width:38px;height:38px;font-size:13px}
.av.q{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint);color:var(--muted)}
.av .ic{width:15px;height:15px}
.tw{overflow-x:auto;position:relative}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td,.t tr.click:focus-visible td{background:var(--panel-2)}
.t tr.click:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.cl b{display:block;color:var(--ink);font-weight:700;white-space:nowrap}
.cl span{font-size:12.5px;color:var(--muted)}
.mini-w{display:inline-block;line-height:0}
.mini-b{fill:var(--bar)}.mini-now{fill:var(--red)}.mini-base{stroke:var(--axis);stroke-width:1}
.fd{display:inline-flex;gap:4px;align-items:center}
.fd i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint)}
.fd i.sent{background:var(--ink);box-shadow:none}
.fd i.draft{background:linear-gradient(90deg,var(--warm) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--warm)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}
.empty b{color:var(--ink)}
.live-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2)}
.live-row:last-child{border-bottom:0}
.live-row b{color:var(--ink)}
.live-row p{font-size:13.5px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;margin-top:5px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,43,43,.5)}70%{box-shadow:0 0 0 10px rgba(250,43,43,0)}100%{box-shadow:0 0 0 0 rgba(250,43,43,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.feed{display:grid}
.fi{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.fi:last-child{border-bottom:0}
.fi b{color:var(--ink);font-weight:700}
.fi small{display:block;font-size:12px;color:var(--muted)}
.fi.dim{opacity:.7}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.back:hover{color:var(--ink)}
.oh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:start;margin-bottom:16px}
.oh h3{font-size:32px;font-weight:800;font-stretch:78%;text-transform:uppercase;line-height:1}
.oh h3:focus{outline:none}
.oh .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.oh .bb{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
@media (max-width:760px){.oh{grid-template-columns:1fr}.oh .bb{justify-content:flex-start}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px;padding:14px 16px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stp{position:relative;padding:20px 8px 0 0;font-size:12px;color:var(--muted);min-width:0}
.stp::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp i{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--axis)}
.stp.done::before{background:var(--ink)}
.stp.done i{background:var(--ink);box-shadow:none}
.stp.cur i{background:var(--red);box-shadow:0 0 0 4px var(--red-50)}
.stp b{display:block;color:var(--ink);font-weight:700;font-size:13px}
.stp.todo b{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tabs button{padding:10px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tabs .n{font-size:11.5px;background:var(--sunk);border-radius:999px;padding:0 6px;color:var(--muted)}
.fstat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.fs{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);display:grid;gap:5px;align-content:start}
.fs .fl{font-size:13px;font-weight:700;color:var(--ink)}
.fs .fw{font-size:12px;color:var(--muted)}
@media (max-width:900px){.fstat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.picks{grid-template-columns:1fr}}
.pk h5{font-size:13px;font-weight:800;margin-bottom:8px}
.pk ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pk li{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--panel-2)}
.pk li b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;margin-right:4px}
.pk li q{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;quotes:"„" "“"}
.split{display:flex;gap:2px;height:14px;margin:6px 0 12px}
.split span{display:block;height:14px}
.split .fx{background:var(--bar);border-radius:4px 0 0 4px}
.split .pf{background:var(--red);border-radius:0 4px 4px 0}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.hist b{color:var(--ink)}
.hist .sum{white-space:pre-line;color:var(--text);font-size:13px;margin-top:4px}
.callout{border-radius:12px;padding:12px 14px;background:var(--amber-50);color:var(--text);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.callout .ic{color:var(--amber);margin-top:2px}
.callout b{color:var(--ink)}
.fig{margin:0}
.fig-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.fig-h h4{font-size:15px;font-weight:700}
.fig-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.tv{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.tv:hover{color:var(--ink);border-color:var(--ink)}
.tv .ic{width:14px;height:14px}
.fig-note{font-size:13px;color:var(--text);margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)}
.hb{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr) max-content;gap:9px 12px;align-items:center;font-size:13px}
.hb .lab{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:280px}
.hb .lab b{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:5px}
.hb .trk{height:16px;display:flex;align-items:center}
.hb .bar{height:16px;border-radius:0 4px 4px 0;background:var(--bar);display:block}
.hb .bar.em{background:var(--red)}
.hb .val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;text-align:right;white-space:nowrap}
.heat{display:grid;gap:3px;font-size:12px;align-items:center}
.heat .hl{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;min-width:0}
.heat .c{height:28px;border-radius:3px;background:var(--h0);display:block}
.heat .c[data-l="1"]{background:var(--h1)}.heat .c[data-l="2"]{background:var(--h2)}.heat .c[data-l="3"]{background:var(--h3)}.heat .c[data-l="4"]{background:var(--h4)}
.heat .xl{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap}
.hscale{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.hscale i{width:18px;height:10px;border-radius:2px;display:inline-block;background:var(--h0)}
.hscale i[data-l="1"]{background:var(--h1)}.hscale i[data-l="2"]{background:var(--h2)}.hscale i[data-l="3"]{background:var(--h3)}.hscale i[data-l="4"]{background:var(--h4)}
.readers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rc{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);display:grid;gap:12px;align-content:start}
.rc-top{display:flex;gap:10px;align-items:center}
.rc-top b{display:block;color:var(--ink)}
.rc-top span{font-size:12.5px;color:var(--muted)}
.rc dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:12.5px}
.rc dt{color:var(--muted)}
.rc dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tl-day{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 0 6px}
.tl-day:first-child{padding-top:0}

// patch(el, html) přepíše jen uzly, které se liší: zůstane posun stránky, fokus, rozepsaná pole (prohlížeč je chrání
// příznakem změny) i rozbalené části <details> (atribut open nastavuje jen uživatel). Uzly se párují podle pořadí;
// prvek s klíčem data-k se páruje jen se stejným klíčem (jinak se vymění celý), aby rozbalení nepřeskočilo na jinou kartu.
function patch(el, html) {
  const tpl = document.createElement(el.tagName);
  tpl.innerHTML = html;
  morphKids(el, tpl);
}
function morphKids(from, to) {
  const fc = Array.from(from.childNodes), tc = Array.from(to.childNodes);
  tc.forEach((t, i) => {
    const f = fc[i];
    if (!f) from.appendChild(t);
    else if (f.nodeType !== t.nodeType || f.nodeName !== t.nodeName) from.replaceChild(t, f);
    else if (f.nodeType === 1 && f.getAttribute('data-k') !== t.getAttribute('data-k')) from.replaceChild(t, f);
    else if (f.nodeType === 1) morphEl(f, t);
    else if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue;
  });
  for (let i = fc.length - 1; i >= tc.length; i--) from.removeChild(fc[i]);
}
function morphEl(f, t) {
  Array.from(f.attributes).forEach(x => { if (!t.hasAttribute(x.name) && !(x.name === 'open' && f.nodeName === 'DETAILS')) f.removeAttribute(x.name); });
  Array.from(t.attributes).forEach(x => { if (f.getAttribute(x.name) !== x.value) f.setAttribute(x.name, x.value); });
  morphKids(f, t);
}

function feedItems(slug) {

Object.assign(V, { firm: '', ftab: 'prehled', fq: '', fmine: false, pmine: false, ff: null, cedit: '', cdel: '', pendingFirm: '', fsave: null });
const CRM_PROB = { ready: 5, sent: 10, opened: 20, engaged: 30, filled: 50, meeting: 60, won: 100, lost: 0, paused: 0 };
const KIND = { note: ['Poznámka', 'pencil'], call: ['Hovor', 'phone'], meeting: ['Schůzka', 'cal'], email: ['E-mail', 'mail'] };
const REASONS = ['Cena', 'Konkurence', 'Načasování', 'Rozpočet', 'Bez rozhodnutí', 'Řeší to sami', 'Řešení na míru', 'Rychlost', 'Reference', 'Vztah', 'Jiný důvod'];
const OPEN_ST = ['ready', 'sent', 'opened', 'engaged', 'filled', 'meeting'];
const crmNorm = s => String(s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');

// indexy pro obrazovky: firma s nabídkami, kontakty, aktivitami a úkoly (data ze serveru v D.crm zůstávají čistá)
function crmPrep(Dd) {
  const C = Dd.M.crm || (Dd.M.crm = { firms: [], contacts: [], acts: [], todos: [], people: [] });
  const F = {}, P = {};
  C.firms.forEach(f => { F[f.id] = Object.assign({}, f, { offers: [], contacts: [], acts: [], todos: [] }); });
  C.people.forEach(p => { P[p.id] = p; });
  C.contacts.forEach(c => { if (F[c.firm]) F[c.firm].contacts.push(c); });
  C.acts.forEach(a => { if (F[a.firm]) F[a.firm].acts.push(a); });
  C.todos.forEach(t => { if (F[t.firm]) F[t.firm].todos.push(t); });
  Dd.list.forEach(o => { crmDerive(o); if (F[o.manual.firm]) F[o.manual.firm].offers.push(o); });
  return Object.assign(Dd, { crm: C, F: F, P: P });
}
function crmDerive(o) {
  o.manual.prob = o.manual.prob === undefined ? null : o.manual.prob;
  o.prob = o.manual.prob != null ? o.manual.prob : CRM_PROB[o.stage[0]] || 0;
  o.weighted = Math.round((o.value || 0) * o.prob / 100);
}
// změna CRM dat v prohlížeči hned (vrátí funkci pro vrácení zpět, když server změnu odmítne)
function crmLocal(fn) {
  const was = JSON.stringify(D.crm);
  fn(D.crm);
  crmPrep(D);
  return () => { D.M.crm = JSON.parse(was); crmPrep(D); };
}
const meId = () => D.me.owner ? 'owner' : D.me.id || '';
const isMine = id => D.me.owner ? !id || id === 'owner' : id === D.me.id;
const person = id => D.P[id] ? D.P[id].name : '';

const whoName = w => w === 'vlastník' ? person('owner') || 'vlastník' : w;
const initialsOf = n => String(n || '?').split(/\s+/).filter(x => x && !/^(Ing|Mgr|Bc|MUDr|JUDr|PhDr|RNDr|doc|prof)\.?$/i.test(x)).slice(0, 2).map(x => x.charAt(0).toUpperCase()).join('') || '?';
const ownerAv = id => id && D.P[id] ? '<span class="av sm" title="' + esc('Odpovědný: ' + person(id)) + '">' + esc(initialsOf(person(id))) + '</span>' : '';
const peopleOpts = (sel, none) => (none ? '<option value="">' + none + '</option>' : '') + D.crm.people.map(p => '<option value="' + esc(p.id) + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name + (p.id === meId() ? ' (vy)' : '')) + '</option>').join('');
const firmOpts = sel => '<option value="">— bez firmy —</option>' + Object.keys(D.F).map(k => D.F[k]).filter(f => !f.archived || f.id === sel).sort((a, b) => a.name.localeCompare(b.name, 'cs'))
  .map(f => '<option value="' + esc(f.id) + '"' + (f.id === sel ? ' selected' : '') + '>' + esc(f.name) + '</option>').join('');
const dueChip = t => { if (!t.due) return ''; const x = dayDiff(NOW, t.due); return t.done ? chip('line', dm(t.due)) : x < 0 ? chip('bad', 'po termínu ' + dm(t.due)) : x === 0 ? chip('warm', 'dnes') : x === 1 ? chip('line', 'zítra') : chip('line', dm(t.due)); };

// souhrn firmy: otevřené nabídky, hodnota, nejlepší zájem, poslední kontakt, příští schůzka, další úkol
function firmStats(f) {
  const open = f.offers.filter(o => OPEN_ST.indexOf(o.stage[0]) >= 0);
  const scored = open.filter(o => o.band && o.band[0] !== 'none').sort((a, b) => b.score.total - a.score.total);
  const last = Math.max.apply(null, [0].concat(f.acts.filter(a => a.at <= NOW).map(a => a.at), f.offers.map(o => o.last || 0)));
  const meets = f.acts.filter(a => a.kind === 'meeting' && a.at > NOW).map(a => a.at).concat(f.offers.map(o => o.manual.meeting).filter(t => t > NOW)).sort((a, b) => a - b);
  const todo = f.todos.filter(t => !t.done).sort((a, b) => (a.due || 9e15) - (b.due || 9e15));
  return { open: open, value: sum(open.map(o => o.value || 0)), weighted: sum(open.map(o => o.weighted)), best: scored[0] || null, last: last, meet: meets[0] || 0, todo: todo,
    late: todo.filter(t => t.due && dayDiff(NOW, t.due) < 0).length };
}

  if (V.pmine) list = list.filter(o => isMine(o.manual.owner || (D.F[o.manual.firm] || {}).owner));
  const open = list.filter(o => OPEN_ST.indexOf(o.stage[0]) >= 0), won = list.filter(o => o.stage[0] === 'won'), lost = list.filter(o => o.stage[0] === 'lost');
  const mEnd = new Date(NOW); mEnd.setMonth(mEnd.getMonth() + 1, 1); mEnd.setHours(0, 0, 0, 0);
  const thisM = open.filter(o => o.manual.close && o.manual.close < mEnd.getTime());
  const right = '<div class="seg" role="group" aria-label="Které nabídky">' + [[0, 'Všechny'], [1, 'Moje']].map(x => '<button type="button" data-pmine="' + x[0] + '" aria-pressed="' + (V.pmine === !!x[0]) + '">' + x[1] + '</button>').join('') + '</div>';
  const tiles = '<div class="kpis">' + kpi('Otevřená hodnota', money(sum(open.map(o => o.value || 0))), open.length + ' ' + plural(open.length, 'nabídka', 'nabídky', 'nabídek')) +
    kpi('Vážená hodnota', money(sum(open.map(o => o.weighted))), 'hodnota × pravděpodobnost') +
    kpi('Uzavřít tento měsíc', money(sum(thisM.map(o => o.weighted))), thisM.length ? thisM.length + ' ' + plural(thisM.length, 'nabídka', 'nabídky', 'nabídek') + ', vážená hodnota' : 'nic s termínem') +
    kpi('Vyhráno', money(sum(won.map(o => o.value || 0))), won.length + '× vyhráno, ' + lost.length + '× prohráno') +
    kpi('Úspěšnost', won.length + lost.length ? Math.round(won.length / (won.length + lost.length) * 100) + ' %' : '—', 'z uzavřených nabídek') + '</div>';
  const card = o => {
    const f = D.F[o.manual.firm], late = o.manual.close && OPEN_ST.indexOf(o.stage[0]) >= 0 && dayDiff(NOW, o.manual.close) < 0, own = o.manual.owner || (f && f.owner);
    return '<div class="kd" role="button" tabindex="0" data-offer="' + esc(o.slug) + '"><b>' + esc(o.short) + '</b><span class="kf">' + esc(f ? f.name : o.client || '') + '</span>' +
      '<span class="kv"><span>' + money(o.value) + '</span><span>' + o.prob + ' %</span></span><span class="km">' + (o.manual.close ? chip(late ? 'bad' : 'line', (late ? 'po termínu ' : '') + dm(o.manual.close), 'cal') : '') +
      (o.band && o.band[0] !== 'none' ? chip(bandCls(o.band), o.score.total) : '') + (o.stage[0] === 'lost' && o.manual.reason ? chip('line', o.manual.reason) : '') + ownerAv(own) + '</span></div>';
  };
  const kb = '<div class="kb">' + PIPE.map(c => {
    const xs = list.filter(o => c[1].indexOf(o.stage[0]) >= 0).sort((a, b) => (a.manual.close || 9e15) - (b.manual.close || 9e15));
    const closed = c[1][0] === 'won' || c[1][0] === 'lost';
    return '<section class="kc" aria-label="' + c[0] + '"><h5><span>' + c[0] + '</span><span>' + xs.length + '</span></h5><div class="ks">' + (xs.length ? (closed ? money(sum(xs.map(o => o.value || 0))) : money(sum(xs.map(o => o.weighted))) + ' vážená') : '&nbsp;') + '</div>' + xs.map(card).join('') + '</section>';
  }).join('') + '</div>';
  const paused = list.filter(o => o.stage[0] === 'paused');
  // výhled: vážená hodnota podle měsíce uzavření (6 měsíců dopředu + po termínu + bez termínu)
  const M = [], base = new Date(NOW); base.setDate(1); base.setHours(0, 0, 0, 0);
  for (let i = 0; i < 6; i++) { const a = new Date(base); a.setMonth(base.getMonth() + i); const b = new Date(a); b.setMonth(a.getMonth() + 1); M.push([a.toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' }), a.getTime(), b.getTime()]); }
  const rows = [['po termínu', open.filter(o => o.manual.close && o.manual.close < base.getTime())]].concat(M.map(m => [m[0], open.filter(o => o.manual.close >= m[1] && o.manual.close < m[2])]), [['bez termínu', open.filter(o => !o.manual.close)]])
    .filter((r, i) => i > 0 && i < 7 || r[1].length).map(r => [r[0], sum(r[1].map(o => o.weighted)), r[1].length + ' ' + plural(r[1].length, 'nabídka', 'nabídky', 'nabídek') + ': ' + (r[1].map(o => o.short).join(', ') || 'žádná')]);
  const fc = fig('Výhled', 'vážená hodnota podle očekávaného uzavření', hbars(rows.map(r => [r[0], r[1], money(r[1])])), table(['Měsíc', 'Vážená hodnota', 'Nabídky'], rows.map(r => [esc(r[0]), money(r[1]), esc(r[2])]), [1]),
    'Pravděpodobnost bez ručního zadání podle fáze: odesláno 10 %, otevřeno 20 %, zapojeno 30 %, vyplněno 50 %, schůzka 60 %. Termín uzavření a pravděpodobnost nastavíte v detailu nabídky → Souhrn → Obchod.');
  return vh('Obchod', 'osobní nabídky podle fáze', right) + tiles + kb +
    (paused.length ? '<p class="fig-note">Pozastaveno: ' + paused.map(o => '<button class="lnk" type="button" data-offer="' + esc(o.slug) + '">' + esc(o.short) + '</button>').join(', ') + '</p>' : '') + '<div class="grid g2e mt">' + fc + winLoss(list) + '</div>';
}
function winLoss(list) {
  const won = list.filter(o => o.stage[0] === 'won'), lost = list.filter(o => o.stage[0] === 'lost');
  if (!won.length && !lost.length) return '<div class="panel"><div class="ph"><h4>Výhry a prohry</h4></div><p class="muted-p">Zatím žádná uzavřená nabídka. U výhry i prohry zapište důvod (detail nabídky → Souhrn), časem tu uvidíte, proč vyhráváte a proč ne.</p></div>';
  const by = (xs, f) => { const m = {}; xs.forEach(o => { const k = f(o) || 'bez důvodu'; m[k] = (m[k] || 0) + 1; }); return Object.keys(m).sort((a, b) => m[b] - m[a]).map(k => [k, m[k]]); };
  const rows = by(lost, o => o.manual.reason), wr = by(won, o => o.manual.reason), riv = by(lost.filter(o => o.manual.rival), o => o.manual.rival);
  const bars = (xs, n) => hbars(xs.map(r => [r[0], r[1], r[1] + '× z ' + n]), { em: 'max' });
  return fig('Výhry a prohry', won.length + '× vyhráno, ' + lost.length + '× prohráno',
    (lost.length ? '<h5 class="sh">Proč prohráváme</h5>' + bars(rows, lost.length) : '') + (won.length ? '<h5 class="sh">Proč vyhráváme</h5>' + bars(wr, won.length) : '') + (riv.length ? '<h5 class="sh">Konkurence</h5>' + bars(riv, lost.length) : ''),
    table(['', 'Důvod', 'Počet'], rows.map(r => ['prohra', esc(r[0]), r[1]]).concat(wr.map(r => ['výhra', esc(r[0]), r[1]]), riv.map(r => ['konkurent', esc(r[0]), r[1]])), [2]));
}

function crmBizRead() {

function crmBizLocal(m, p) {

}

    '<div class="oh"><div><h3 tabindex="-1" data-vh>' + esc(o.short) + '</h3><div class="meta">' + (D.F[o.manual.firm] ? firmLink(o.manual.firm) : esc(o.client || '')) + (o.vendor && o.vendor !== 'XpertDigital' ? ' · ' + esc(o.vendor) : '') + ' · <span class="mono">' + esc(url.replace('https://', '')) + '</span>' + stageChip(o) +
    (o.band ? scoreCell(o).replace('class="score"', 'class="score" style="min-width:0"') : '') + (o.meta.encrypt ? chip('line', 'šifrovaná') : '') + (o.live ? chip('hot', 'právě čte') : '') + (o.valid !== 'ok' ? chip('bad', o.valid === 'ended' ? 'platnost ukončena' : 'po platnosti') : '') + '</div></div>' +

  const base = o.sentAt || o.registeredAt, firstS = o.firstView;
  const tiles = '<div class="kpis">' +
    kpi('Zobrazení', o.views, o.arch ? 'z toho ' + o.arch.views + ' starších než 12 měsíců' : o.anon.views.length ? 'z toho ' + o.anon.views.length + ' bez souhlasu' : o.views ? 'všechna se souhlasem' : 'zatím žádné') +
    kpi('Čtenáři', o.readerKeys.length, o.readerKeys.length ? o.readerKeys.filter(k => k.indexOf('p:') === 0).length + ' s osobním odkazem' : 'se souhlasem s měřením') +
    kpi('Čistý čas', o.act ? durS(o.act) : '0 min', o.sess.length ? 'průměrně ' + durS(o.act / o.sess.length) + ' na návštěvu' : '') +
    kpi('Odesláno', o.hist.length + '×', o.hist.length ? 'naposledy ' + when(o.hist[o.hist.length - 1].at) : 'zatím nic') +
    kpi('Do prvního otevření', firstS && base ? durH(Math.max(0, firstS - base)) : '—', firstS ? (o.sentAt ? 'od prvního osobního odkazu' : 'od sestavení nabídky') : 'neotevřeno') + '</div>';
  const bar = '<div class="tabs" role="tablist" aria-label="Detail nabídky">' + tabs.map(t => '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (V.tab === t[0]) + '" tabindex="' + (V.tab === t[0] ? 0 : -1) + '">' + t[1] + (t[2] ? ' <span class="n">' + t[2] + '</span>' : '') + '</button>').join('') + '</div>';
  const body = { souhrn: tSummary, brief: tBrief, vyplneno: tFilled, ctenari: tReaders, osa: tTimeline, chovani: tBehaviour }[V.tab](o);
  return head + tiles + bar + '<div role="tabpanel">' + body + '</div>';

// Brief na schůzku: podklad z dat (brief.gs) a zadání pro Claude, hotový brief napíše Claude Code nebo claude.ai

  const team = '<div class="panel"><div class="ph"><h4>Kdo čte</h4><span>se souhlasem</span></div>' + (B.readers.length ? '<div class="team">' + B.readers.map(r => '<div class="tr">' + avatar(r) + '<div><b>' + esc(r.name) + '</b><span>' + esc([r.role, r.visits + '× · ' + durS(r.act), r.devs.join('/'), 'naposledy ' + when(r.last)].filter(Boolean).join(' · ')) + '</span></div></div>').join('') + '</div>' : '<p class="fig-note">Zatím nikdo se souhlasem s měřením.</p>') + '</div>';
  const fu = '<div class="panel"><div class="ph"><h4>Follow-up po schůzce</h4><span>návrh e-mailu</span></div><p class="draft-t" style="padding:0">' + esc(B.followup) + '</p><div class="btnrow"><button class="btn" type="button" data-copytext="' + esc(B.followup) + '">' + icon('copy') + 'Kopírovat</button></div><p class="fig-note">Upravte podle toho, na čem jste se domluvili. Lepší verzi napíše Claude ze zadání výše.</p></div>';

function tFilled(o) {
  const st = o.forms || {}, d = o.inp && o.inp.data ? o.inp.data : null, lastH = o.hist[o.hist.length - 1];
  const whoLast = lastH && lastH.who ? lastH.who.name : '';
  const strip = '<div class="fstat">' + FORMS.map(f => {
    const s = st[f[0]];
    return '<div class="fs"><span class="fl">' + f[1] + '</span>' + (s === 'sent' ? chip('ok', 'Odesláno', 'check') : s === 'draft' ? chip('warm', 'Rozpracováno') : chip('line', 'Nic')) +
      '<span class="fw">' + (s === 'sent' ? (whoLast ? esc(whoLast) + ' · ' : '') + when(o.inp.savedAt) + (st[f[0] + 'Draft'] ? ' · pak změny' : '') : s === 'draft' ? 'neodesláno' : '—') + '</span></div>';
  }).join('') + '</div>';
  const out = [strip];
  const since = (o.inp ? o.inp.savedAt : 0) + 3000, ED = [];
  o.sess.forEach(s => (s.edits || []).forEach(e => { if (e[0] > since) ED.push({ t: e[0], k: e[1], x: e[2], who: s.who }); }));
  ED.sort((a, b) => a.t - b.t);
  if (ED.length) {
    const inputs = {}; (o.meta.inputs || []).forEach(i => { inputs[i.id] = i.label; });
    const fields = Array.from(new Set(ED.filter(e => e.k === 'f').map(e => e.x))).map(f => f === 'kpi' ? 'vlastní ukazatele' : f === 'wish' ? 'přání' : f === 'reset' ? 'vrácení odhadů' : inputs[f] || f);
    const picks = new Set(ED.filter(e => e.k === 'p' || e.k === 'n').map(e => e.x)).size, price = ED.filter(e => e.k === 'c').length, last = ED[ED.length - 1];
    out.push('<div class="callout mt">' + icon('pencil') + '<span><b>Rozpracováno, zatím neodesláno.</b> ' + (fields.length ? 'Pole: ' + esc(fields.join(', ')) + '. ' : '') + (picks ? 'Výběr u ' + picks + ' ' + plural(picks, 'karty', 'karet', 'karet') + '. ' : '') + (price ? 'Změny ceny: ' + price + '×. ' : '') +
      'Hodnoty uvidíme, až je klient odešle. Naposledy ' + esc(last.who.name) + ', ' + when(last.t) + '.</span></div>');
  }
  if (!d) { if (!ED.length) out.push('<div class="empty mt">Zatím nic neodeslali. Formuláře se tu ukážou, jakmile klient klikne na <b>Uložit a poslat</b>.</div>'); return out.join(''); }
  const edited = (o.meta.inputs || []).filter(i => d.edited && d.edited[i.id]);
  if (edited.length) out.push('<div class="panel mt"><div class="ph"><h4>Vaše čísla</h4><span>' + (whoLast ? esc(whoLast) + ' · ' : '') + when(o.inp.savedAt) + '</span></div>' + table(['Ukazatel', 'Náš odhad', 'Jejich číslo', 'Rozdíl'], edited.map(i => {
    const own = +d.values[i.id], diff = i.value ? own / i.value - 1 : 0;
    return [esc(i.label) + (i.unit ? ' <span style="color:var(--muted)">(' + esc(i.unit) + ')</span>' : ''), fmt(i.value, i.value % 1 ? 1 : 0), '<b style="color:var(--ink)">' + fmt(own, own % 1 ? 1 : 0) + '</b>', chip('line', (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff) * 100) + ' %')];
  }), [1, 2, 3]) + '</div>');
  const kp = (d.kpis || []).filter(k => k && String(k.name || '').trim());
  if (kp.length) out.push('<div class="panel mt"><div class="ph"><h4>Vlastní ukazatele</h4></div>' + table(['Ukazatel', 'Dnes', 'Cíl', 'Jednotka'], kp.map(k => ['<b style="color:var(--ink)">' + esc(k.name) + '</b>', esc(k.now || '—'), esc(k.goal || '—'), esc(k.unit || '')]), [1, 2]) + '</div>');
  const P = d.prio || {}, ids = Object.keys(P).filter(id => P[id] && (P[id].p || P[id].note));
  if (ids.length) {
    const col = (p, label, cls) => { const it = ids.filter(id => P[id].p === p); return '<div class="pk"><h5>' + chip(cls, label + ' · ' + it.length) + '</h5><ul>' + (it.length ? it.map(id => '<li><b>' + esc(id) + '</b>' + esc(cardTitle(o, id)) + (P[id].note ? '<q>' + esc(P[id].note) + '</q>' : '') + '</li>').join('') : '<li>nic</li>') + '</ul></div>'; };
    out.push('<div class="panel mt"><div class="ph"><h4>Boostery</h4><span>' + ids.length + ' ' + plural(ids.length, 'karta', 'karty', 'karet') + '</span></div><div class="picks">' + col('yes', 'Chceme', 'ok') + col('maybe', 'Možná', 'warm') + col('no', 'Nechceme', '') + '</div></div>');
  }
  if (o.meta.presets && d.fixed != null && st.price === 'sent') {

      '<p style="font-size:13.5px">' + (fx >= 100 ? 'Celá cena pevně, bez výkonové složky.' : 'Klient chce sdílet riziko: ' + (100 - fx) + ' % ceny navážeme na splnění cíle.') + '</p></div>');
  }
  const mods = (o.meta.weeks || []).filter(w => w[3]), areas = o.meta.areas || [];
  if (mods.length || (d.calc && areas.length)) {
    const rows = mods.map(w => ['Modul ' + esc(w[1] || w[2]), d.modules && d.modules[w[0]] ? chip('ok', 'ano') : chip('line', 'ne')])
      .concat(d.calc && Array.isArray(d.calc.x) ? areas.map((a, i) => ['Kalkulačka · ' + esc(a || 'oblast ' + (i + 1)), d.calc.on && d.calc.on[i] === false ? chip('line', 'vypnuto') : fmt((+d.calc.x[i] || 0) * 100) + ' %']) : []);
    out.push('<div class="panel mt"><div class="ph"><h4>Moduly a kalkulačka</h4><span>jak je odeslali</span></div>' + table(['', 'Nastavení'], rows, [1]) + '</div>');
  }
  if (String(d.wish || '').trim()) out.push('<div class="panel mt"><div class="ph"><h4>Přání</h4></div><p style="font-size:15px;color:var(--ink)">„' + esc(d.wish.trim()) + '“</p></div>');
  out.push('<div class="panel mt"><div class="ph"><h4>Historie změn</h4><span>každé odeslání je nová verze, rozdíl proti předchozí</span></div><ul class="hist">' + o.hist.slice().reverse().map(h =>
    '<li><time>' + when(h.at) + '</time><span><b>' + esc(h.who ? h.who.name + (h.who.role ? ', ' + h.who.role : '') : h.p ? 'kód ' + h.p : 'bez jména') + '</b>' +
    (h.diff && h.diff.length ? '<ul class="diff">' + h.diff.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<div class="sum">beze změn proti předchozí verzi</div>') + '</span></li>').join('') + '</ul></div>');
  return out.join('');
}

// potvrzení smazání údajů čtenáře na žádost (jen vlastník Velínu)
function forgetBox(o) {

  const ss = o.sess.filter(s => s.who.key === F.key), sent = tok ? o.hist.filter(h => h.p === tok).length : 0;
  const name = l ? l.name : ss.length ? ss[0].who.name : 'čtenář';
  return '<div class="panel forget" role="alertdialog" aria-labelledby="fg-h" aria-describedby="fg-t"><h4 id="fg-h" tabindex="-1">Smazat údaje: ' + esc(name) + '?</h4>' +
    '<p id="fg-t">Smaže ' + ss.length + ' ' + plural(ss.length, 'návštěvu', 'návštěvy', 'návštěv') +
    (tok ? (sent ? ', u ' + sent + ' ' + plural(sent, 'odeslání', 'odeslání', 'odeslání') + ' formulářů odstraní jméno' : '') + ' a osobní odkaz zneplatní, místo jména zůstane „Smazaný čtenář“. Údaje o firmě z formulářů zůstanou.'
      : ' z tohoto zařízení. Když čtenář nabídku znovu otevře a souhlasí s měřením, měření začne znovu.') + ' Smazání nejde vrátit.</p>' +

function mailText(o, url) {

function tTimeline(o) {
  const items = feedItems(o.slug);
  const archNote = o.arch ? '<p class="fig-note">Starší návštěvy (' + o.arch.views + ' zobrazení do ' + dm(o.arch.last) + ') zůstaly jen jako měsíční souhrn v listu Archiv.</p>' : '';
  if (!items.length) return '<div class="empty">Zatím žádná aktivita.' + (o.links.length || o.arch ? '' : ' Vytvořte osobní odkaz v záložce Čtenáři.') + '</div>' + archNote;
  let out = '', lastDay = null;
  items.forEach(i => {
    const dk = sod(i.at);
    if (dk !== lastDay) { const x = dayDiff(dk, NOW); out += '<div class="tl-day">' + (x === 0 ? 'Dnes' : x === 1 ? 'Včera' : DOW[new Date(dk).getDay()] + ' ' + dm(dk)) + '</div>'; lastDay = dk; }
    if (i.kind === 'sess') {
      const s = i.s;
      const path = s.path.slice(0, 18).map(k => k === '!save' ? '<span class="x">odesláno</span>' : k === '!contact' ? '<span class="x">kontakt</span>' : k === '!share' ? '<span class="x">poslat kolegovi</span>' : k.indexOf('k:') === 0 ? '<span class="k" title="' + esc(cardTitle(o, k.slice(2))) + '">karta ' + esc(k.slice(2)) + '</span>' : '<span>' + esc(secLabel(o, k)) + '</span>').join('') + (s.path.length > 18 ? '<span>…</span>' : '');
      const extra = [];
      const f = Object.keys(s.fields).length; if (f) extra.push('upravená pole: ' + f);
      if (s.picks.length) extra.push('výběr u ' + s.picks.length + ' ' + plural(s.picks.length, 'karty', 'karet', 'karet'));
      if (s.price) extra.push('cena ' + s.price + '×');
      if (s.calc) extra.push('kalkulačka ' + s.calc + '×');
      if (s.copies.length) extra.push('zkopírováno: ' + s.copies.map(c => c === 'phone' ? 'telefon' : c === 'email' ? 'e-mail' : c).join(', '));
      out += '<div class="tl-it"><time>' + hm(s.start) + '–' + (s.live ? 'teď' : hm(s.end)) + '</time>' + avatar(s.who) + '<div><b>' + esc(s.who.name) + '</b> · ' + esc(devLabel(s)) + ' · ' + durS(s.act) +
        '<span class="fl">' + (s.live ? chip('hot', 'právě čte') : '') + (i.label === 'Poprvé otevřeno' ? chip('line', 'poprvé') : '') + (s.saves ? chip('ok', 'odesláno') : '') + (s.saveFail ? chip('bad', 'odeslání selhalo') : '') + '</span>' +
        (extra.length ? '<div class="sub">' + esc(extra.join(' · ')) + '</div>' : '') + (path ? '<div class="path">' + path + '</div>' : '') + '</div></div>';
    } else if (i.kind === 'save') {
      out += '<div class="tl-it"><time>' + hm(i.at) + '</time>' + avatar(i.who) + '<div><b>Odesláno</b> · ' + esc(i.text) + (i.h.diff && i.h.diff.length ? '<ul class="diff">' + i.h.diff.slice(0, 6).map(x => '<li>' + esc(x) + '</li>').join('') + (i.h.diff.length > 6 ? '<li>a další (záložka Vyplněno)</li>' : '') + '</ul>' : '') + '</div></div>';
    } else {
      out += '<div class="tl-it' + (i.dim ? ' dim' : '') + '"><time>' + hm(i.at) + '</time>' + avatar(i.who, i.kind) + '<div><b>' + esc(i.label) + '</b> · ' + esc(i.text) + (i.sub ? '<div class="sub">' + esc(i.sub) + '</div>' : '') + '</div></div>';
    }
  });
  return '<div class="panel">' + out + '</div>' + archNote;
}

function tBehaviour(o) {
  if (!o.sess.length) return '<div class="empty">Chování uvidíte u čtenářů, kteří souhlasili s měřením.' + (o.anon.views.length ? ' Zatím ' + o.anon.views.length + ' ' + plural(o.anon.views.length, 'zobrazení', 'zobrazení', 'zobrazení') + ' bez souhlasu.' : '') + '</div>';
  const secs = {}, cards = {}, opens = {};
  o.sess.forEach(s => { Object.keys(s.secs).forEach(k => { secs[k] = (secs[k] || 0) + s.secs[k]; }); Object.keys(s.cards).forEach(k => { cards[k] = (cards[k] || 0) + s.cards[k]; }); s.opened.forEach(k => { opens[k] = (opens[k] || 0) + 1; }); });
  const order = ['a', 'b', 'c', 'd', 'cena'].concat((o.meta.weeks || []).map(w => 'w' + w[0])).concat(['prehled']);
  Object.keys(secs).forEach(k => { if (order.indexOf(k) < 0) order.push(k); });
  const sr = order.filter(k => secs[k]).map(k => [secLabel(o, k), secs[k]]), tot = sum(sr.map(r => r[1])) || 1;
  const secFig = fig('Kde tráví čas', 'Čistý čas v částech mapy, všichni čtenáři', sr.length ? hbars(sr.map(r => [r[0], r[1], durS(r[1])]), { em: true }) : '<p class="fig-note">Zatím bez času v sekcích.</p>', table(['Část mapy', 'Čas', 'Podíl'], sr.map(r => [esc(r[0]), durS(r[1]), fmt(r[1] / tot * 100) + ' %']), [1, 2]));
  const ck = Object.keys(Object.assign({}, cards, opens)).sort((a, b) => (cards[b] || 0) - (cards[a] || 0) || (opens[b] || 0) - (opens[a] || 0)).slice(0, 10);
  const cardFig = fig('Nejčtenější karty', 'Čas v detailu karty, kolikrát otevřená', ck.length ? hbars(ck.map(id => [cardLabel(o, id), cards[id] || 0, durS(cards[id] || 0) + ', otevřena ' + (opens[id] || 0) + '×', '<b>' + esc(id) + '</b>' + esc(cardTitle(o, id)), durS(cards[id] || 0)]), { em: true }) : '<p class="fig-note">Karty zatím nikdo neotevřel.</p>', table(['Karta', 'Čas', 'Otevřena'], ck.map(id => [esc(cardLabel(o, id)), durS(cards[id] || 0), (opens[id] || 0) + '×']), [1, 2]));
  const firstDay = sod(Math.min.apply(null, o.sess.map(s => s.start))), start = Math.max(firstDay, daysBack(30)[0]);
  const days = []; for (let d = start; d <= sod(NOW); d = sod(d + 36 * 36e5)) days.push(d);
  const keys = Array.from(new Set(o.sess.map(s => s.who.key))), whoOf = k => o.sess.find(s => s.who.key === k).who;
  const lvl = m => m <= 0 ? 0 : m < 4 ? 1 : m < 10 ? 2 : m < 20 ? 3 : 4, every = days.length > 16 ? 3 : 1;
  let heat = '<div class="heat" style="grid-template-columns:minmax(96px,170px) repeat(' + days.length + ',minmax(0,1fr))">';
  keys.forEach(k => {
    const w = whoOf(k);
    heat += '<span class="hl">' + esc(w.name) + '</span>' + days.map(d => { const m = sum(o.sess.filter(s => s.who.key === k && sod(s.start) === d).map(s => s.act)) / 60; return '<span class="c" data-l="' + lvl(m) + '"' + (m ? ' tabindex="0"' : '') + ' data-tip="' + esc((m ? dur(Math.max(1, m)) : 'bez aktivity') + '\n' + w.name + ' · ' + DOW[new Date(d).getDay()] + ' ' + dm(d)) + '"></span>'; }).join('');
  });
  heat += '<span></span>' + days.map((d, i) => '<span class="xl">' + (i % every === 0 || i === days.length - 1 ? new Date(d).getDate() + '.' : '') + '</span>').join('') + '</div><div class="hscale"><span>méně</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>více</span><span style="margin-left:8px">čtverec = jeden den</span></div>';
  const heatTbl = table(['Čtenář', 'Návštěvy', 'Čas'], keys.map(k => { const ss = o.sess.filter(s => s.who.key === k); return [esc(whoOf(k).name), ss.length, durS(sum(ss.map(s => s.act)))]; }), [1, 2]);
  const S = o.sess, dD = S.filter(s => s.dev === 'm' || s.dev === 't').length;
  const facts = '<div class="panel"><div class="ph"><h4>Další signály</h4></div><table class="t"><tbody>' + [
    ['Kalkulačka', sum(S.map(s => s.calc)) + '× posun nebo přepnutí'],
    ['Cena', sum(S.map(s => s.price)) + '× změna volby'],
    ['Formuláře', (n => n + ' ' + plural(n, 'upravené pole', 'upravená pole', 'upravených polí'))(sum(S.map(s => Object.keys(s.fields).length))) + ', výběr u ' + (n => n + ' ' + plural(n, 'karty', 'karet', 'karet'))(new Set([].concat.apply([], S.map(s => s.picks))).size)],
    ['Kontakt', sum(S.map(s => s.contact)) + '× otevřen' + (S.some(s => s.copies.length) ? ', zkopírováno: ' + Array.from(new Set([].concat.apply([], S.map(s => s.copies)))).map(c => c === 'phone' ? 'telefon' : c === 'email' ? 'e-mail' : c).join(', ') : '')],
    ['Poslat kolegovi', sum(S.map(s => s.shares || 0)) + '×'],
    ['Zařízení', (S.length - dD) + '× počítač, ' + dD + '× mobil nebo tablet'],
    ['Zdroj', Array.from(new Set(S.map(s => s.ref || 'přímo'))).join(', ')]
  ].map(r => '<tr><td style="color:var(--muted)">' + r[0] + '</td><td>' + esc(r[1]) + '</td></tr>').join('') + '</tbody></table></div>';
  return '<div class="grid g2e">' + secFig + cardFig + '</div><div class="grid g2 mt">' + fig('Kdo a kdy čte', 'Minuty čtení po dnech', heat, heatTbl) + facts + '</div>';

/* ============ Analytika napříč nabídkami ============ */
function vAnalytics() {
  const A = D.A;
  if (!A.funnel) return vh('Analytika') + '<div class="empty">Zatím málo dat.</div>';
  const F = A.funnel;
  const funnel = fig('Trychtýř nabídek', 'Kolik osobních nabídek došlo do jaké fáze', hbars(F.map((f, i) => [f[0], f[1], f[1] + ' ' + plural(f[1], 'nabídka', 'nabídky', 'nabídek'), null, f[1] + (i && F[i - 1][1] ? ' <small style="color:var(--muted);font-weight:500">' + fmt(f[1] / F[i - 1][1] * 100) + ' %</small>' : '')]), { max: Math.max(1, F[0][1]) }),
    table(['Fáze', 'Nabídek', 'Z předchozí'], F.map((f, i) => [f[0], f[1], i && F[i - 1][1] ? fmt(f[1] / F[i - 1][1] * 100) + ' %' : '—']), [1, 2]), A.personal < 10 ? 'Malý vzorek, berte to jako signál, ne statistiku.' : '');
  const WD = ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'], BL = A.blocks.map(b => b[0] + '–' + b[1]);
  let hm2 = '<div class="heat" style="grid-template-columns:34px repeat(' + BL.length + ',minmax(0,1fr))"><span></span>' + BL.map(b => '<span class="xl">' + b + '</span>').join('');
  let top = [0, 0, 0];
  A.heat.forEach((row, wi) => { hm2 += '<span class="hl">' + WD[wi] + '</span>' + row.map((n, bi) => { if (n > top[0]) top = [n, wi, bi]; return '<span class="c" data-l="' + Math.min(4, n) + '"' + (n ? ' tabindex="0"' : '') + ' data-tip="' + esc(n + ' ' + plural(n, 'návštěva', 'návštěvy', 'návštěv') + '\n' + WD[wi] + ' ' + BL[bi] + ' h') + '"></span>'; }).join(''); });
  hm2 += '</div><div class="hscale"><span>méně</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>více</span></div>';
  const when2 = fig('Kdy klienti čtou', 'Začátky návštěv podle dne a hodiny', hm2, table(['Den'].concat(BL), WD.map((d, i) => [d].concat(A.heat[i])), [1, 2, 3, 4, 5, 6]), top[0] ? 'Nejvíc návštěv: <b>' + ['v pondělí', 'v úterý', 've středu', 've čtvrtek', 'v pátek', 'v sobotu', 'v neděli'][top[1]] + ' ' + BL[top[2]] + ' h</b>. Tehdy je nejlepší čas se ozvat.' : '');
  const B = A.boosters.slice(0, 14), nB = Math.max(1, Math.max.apply(null, B.map(b => b.yes + b.maybe + b.no).concat([1])));
  const seg = (b, k, l) => b[k] ? '<span class="sg ' + k + '" tabindex="0" style="width:' + (b[k] / nB * 100) + '%" data-tip="' + esc(b[k] + '× ' + l + '\n' + b.offers.join(', ')) + '">' + b[k] + '</span>' : '';
  const boost = fig('Boostery napříč nabídkami', 'Volby z odeslaných výběrů, stejné schopnosti sloučené', B.length ? '<div class="legend"><span><i class="yes"></i>Chceme</span><span><i class="maybe"></i>Možná</span><span><i class="no"></i>Nechceme</span></div><div class="sb">' + B.map(b => '<span class="lab">' + esc(b.label) + '</span><span class="trk">' + seg(b, 'yes', 'Chceme') + seg(b, 'maybe', 'Možná') + seg(b, 'no', 'Nechceme') + '</span>').join('') + '</div>' : '<p class="fig-note">Zatím žádný odeslaný výběr.</p>',
    table(['Booster', 'Chceme', 'Možná', 'Nechceme', 'Nabídky'], B.map(b => [esc(b.label), b.yes, b.maybe, b.no, esc(b.offers.join(', '))]), [1, 2, 3]));
  const C = A.corrections, pct = v => (v >= 0 ? '+' : '−') + fmt(Math.abs(v) * 100) + ' %';
  const corr = fig('Jak klienti opravují naše odhady', 'Průměrná změna proti odhadu v odeslaných číslech', C.length ? '<div class="legend"><span><i class="neg"></i>klient číslo snížil</span><span><i class="pos"></i>klient číslo zvýšil</span></div><div class="dv">' + C.map(c => '<span class="lab">' + esc(c.label) + '</span><span class="trk"><span class="bar ' + (c.avg < 0 ? 'neg' : 'pos') + '" tabindex="0" style="width:' + (Math.min(1, Math.abs(c.avg) / 0.5) * 50).toFixed(1) + '%" data-tip="' + esc(pct(c.avg) + '\n' + c.label + ', ' + c.offers.join(', ')) + '"></span></span><span class="val">' + pct(c.avg) + '</span>').join('') + '<span></span><span class="ax"><span>−50 %</span><span>0</span><span>+50 %</span></span><span></span></div>' : '<p class="fig-note">Zatím nikdo neodeslal svá čísla.</p>',
    table(['Ukazatel', 'Průměrná změna', 'Nabídek'], C.map(c => [esc(c.label), pct(c.avg), c.n]), [1, 2]));
  const RC = A.reach, rk = ['a', 'b', 'program', 'c', 'd', 'cena'].filter(k => RC.secs[k] != null || RC.n);
  const reach = fig('Kam se čtenáři dostanou', 'Podíl čtenářů se souhlasem, kteří část mapy otevřeli', RC.n ? hbars(rk.map(k => [secLabel(null, k), (RC.secs[k] || 0) / RC.n, fmt((RC.secs[k] || 0) / RC.n * 100) + ' %']), { max: 1, em: 'min' }) : '<p class="fig-note">Zatím žádný čtenář se souhlasem.</p>', table(['Část mapy', 'Čtenářů'], rk.map(k => [secLabel(null, k), RC.n ? fmt((RC.secs[k] || 0) / RC.n * 100) + ' %' : '—']), [1]));
  const tiles = '<div class="kpis">' +
    kpi('Medián do prvního otevření', A.medianFirstOpen != null ? durH(A.medianFirstOpen) : '—', 'od prvního osobního odkazu') +
    kpi('Průměrná návštěva', durS(A.avgSession || 0), A.sessions + ' návštěv se souhlasem') +
    kpi('Čtenářů na nabídku', A.readersPerOffer ? fmt(A.readersPerOffer, 1) : '—', 'nákupní tým u otevřených nabídek') +
    kpi('Volba ceny', A.prices.length ? A.prices.map(p => Math.round(p.fixed * 100) + ' %').join(', ') : '—', A.prices.length ? 'pevná část u ' + A.prices.map(p => p.short).join(', ') : 'zatím nikdo nezvolil') +
    kpi('Anonymní zobrazení', A.anonViews, 'bez souhlasu, všechny stránky') + '</div>';
  return vh('Analytika', 'všechny osobní nabídky od začátku měření') + tiles + '<div class="grid g2e">' + funnel + when2 + '</div><div class="grid g2e mt">' + boost + corr + '</div><div class="grid g2e mt">' + reach + '</div>';
}
