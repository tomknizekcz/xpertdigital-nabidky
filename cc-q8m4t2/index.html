function bindGlobal() {
  // Klik: karty, odkazy na sekce
  document.addEventListener('click', e => {
    const md = e.target.closest('[data-mod]');
    if (md) { const n = +md.dataset.mod; setModule(n, !modState[n]); return; }
    const cta = e.target.closest('[data-cta]');
    if (cta) { openMenu(false); closeCard(); openContact(); return; }
    const cp = e.target.closest('[data-copy]');
    if (cp) { copyText(cp); return; }
    if (e.target.closest('[data-cclose]')) { closeContact(); return; }
    const go1 = e.target.closest('[data-go]');
    if (go1) { e.preventDefault(); openMenu(false); closeCard(); go(go1.dataset.go); return; }
    const op = e.target.closest('[data-open]');
    if (op) { openCard(op.dataset.open); return; }
    const card = e.target.closest('[data-card]');
    if (card && world.contains(card)) { openCard(card.dataset.card); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) {
      const g = tab.dataset.tab, i = tab.dataset.i;
      $$('[data-tab="' + g + '"]').forEach(b => b.setAttribute('aria-selected', String(b === tab)));
      $$('[data-pane="' + g + '"]').forEach(p => p.hidden = p.dataset.i !== i);
    }
    if (e.target.closest('[data-close]')) closeCard();
    if (e.target.closest('[data-gclose]')) closeGuide();
  });
  $('#menuBtn').addEventListener('click', () => openMenu($('#drawer').hidden));
  $('#drClose').addEventListener('click', () => openMenu(false));
  $('#scrim').addEventListener('click', () => openMenu(false));
  $('#modeBtn').addEventListener('click', () => { linearForced = !isLinear(); openMenu(false); setMode(); window.scrollTo(0, 0); });
  $('#zoomctl').addEventListener('click', e => {
    const b = e.target.closest('[data-z]'); if (!b) return;
    const z = b.dataset.z, cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
    if (z === 'in') zoomAt(1.3, cx, cy); else if (z === 'out') zoomAt(1 / 1.3, cx, cy);
    else if (z === 'fit') go('all'); else if (z === 'page') { linearForced = true; setMode(); window.scrollTo(0, 0); }
    else if (z === 'help') { $('#guide').hidden ? openGuide() : closeGuide(); }
  });
  mqNarrow.addEventListener('change', () => { linearForced = modeParam; setMode(); });
  // fokus do pole mimo obraz nesmí posunout skrytý posuvník mapy (mapu posouvá jen transformace)
  vp.addEventListener('scroll', () => { if (!isLinear() && (vp.scrollTop || vp.scrollLeft)) { vp.scrollTop = 0; vp.scrollLeft = 0; } });
  window.addEventListener('resize', () => { if (!isLinear()) computeMin(); });

  // Klávesnice
  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    interacted = true;
    if (!$('#contact').hidden) {
      if (e.key === 'Escape') closeContact(); else if (e.key === 'Tab') trapFocus(e, $('#contact .m-panel'));
      return;
    }
    if (!$('#modal').hidden) {
      if (e.key === 'Escape') closeCard();
      else if (tag !== 'input' && tag !== 'select' && tag !== 'textarea') {
        if (e.key === 'ArrowRight') { const n = cardOrder[cardOrder.indexOf(curCard) + 1]; if (n) openCard(n); }
        if (e.key === 'ArrowLeft') { const p = cardOrder[cardOrder.indexOf(curCard) - 1]; if (p) openCard(p); }
        if (e.key === 'Tab') trapFocus(e, $('#modal .m-panel'));
      }
      return;
    }
    if (!$('#drawer').hidden) { if (e.key === 'Escape') openMenu(false); return; }
    if (!$('#guide').hidden && e.key === 'Escape') { closeGuide(); return; }
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'n') { $('#guide').hidden ? openGuide() : closeGuide(); return; }
    if (isLinear()) return;
    const cx = vp.clientWidth / 2, cy = vp.clientHeight / 2;
    if (k === 'f') go('all');
    else if (k === '+' || k === '=') zoomAt(1.3, cx, cy);
    else if (k === '-' || k === '_') zoomAt(1 / 1.3, cx, cy);
    else if (['a', 'b', 'c', 'd'].includes(k)) go(k);
    else if (/^[1-9]$/.test(k) && $('#week-' + k)) go('w' + k);
    else if (k.startsWith('arrow')) {
      e.preventDefault(); const d = 140;
      if (k === 'arrowleft') st.x += d; if (k === 'arrowright') st.x -= d; if (k === 'arrowup') st.y += d; if (k === 'arrowdown') st.y -= d;
      apply(); touch();
    }
  });

  // Myš, dotyk, touchpad
  const pts = new Map(); let drag = null, pinch = null, suppress = false;
  vp.addEventListener('pointerdown', e => {
    if (isLinear()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest('input,select,textarea,summary,.no-pan')) return;
    cancelAnimationFrame(animId); interacted = true;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: st.x, oy: st.y, moved: false };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: st.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, ox: st.x, oy: st.y }; if (drag) drag.moved = true; }
  });
  window.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size >= 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const ns = clamp(pinch.s * d / pinch.d, MIN, MAX), k = ns / pinch.s;
      st.s = ns; st.x = mx - (pinch.mx - pinch.ox) * k; st.y = my - (pinch.my - pinch.oy) * k; apply(); touch(); return;
    }
    if (drag && e.pointerId === drag.id) {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; vp.classList.add('dragging'); try { vp.setPointerCapture(e.pointerId); } catch (_) {} }
      if (drag.moved) { st.x = drag.ox + dx; st.y = drag.oy + dy; apply(); touch(); }
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (drag && drag.moved) { suppress = true; setTimeout(() => { suppress = false; }, 0); }
    if (pts.size < 2) pinch = null;
    if (pts.size === 1) { const [id, p] = [...pts.entries()][0]; drag = { id, sx: p.x, sy: p.y, ox: st.x, oy: st.y, moved: true }; }
    if (pts.size === 0) { drag = null; vp.classList.remove('dragging'); }
  };
  window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
  window.addEventListener('click', e => { if (suppress) { e.stopPropagation(); e.preventDefault(); suppress = false; } }, true);
  vp.addEventListener('wheel', e => {
    if (isLinear()) return;
    e.preventDefault(); cancelAnimationFrame(animId);
    let dx = e.deltaX, dy = e.deltaY;
    if (e.deltaMode === 1) { dx *= 16; dy *= 16; } else if (e.deltaMode === 2) { dx *= 400; dy *= 400; }
    interacted = true;
    // touchpad (malé plynulé delty nebo vodorovný pohyb) = posun, kolečko myši = zoom, Shift+kolečko = vodorovný posun
    if (e.shiftKey && !e.ctrlKey) { st.x -= (dx || dy); apply(); touch(); return; }
    const isPan = !e.ctrlKey && (Math.abs(dx) > 0 || (e.deltaMode === 0 && Math.abs(dy) < 40));
    if (isPan) { st.x -= dx; st.y -= dy; apply(); touch(); return; }
    const r = vp.getBoundingClientRect();
    zoomAt(Math.exp(-dy * (e.ctrlKey ? 0.012 : 0.0016)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  vp.addEventListener('dblclick', e => {
    if (isLinear() || e.target.closest('.card,button,a,input,textarea,.area,.inputs,.pick,.pricing')) return;
    const r = vp.getBoundingClientRect(); zoomAt(1.6, e.clientX - r.left, e.clientY - r.top);
  });
}
function trapFocus(e, root) {
  const f = $$('button:not([disabled]),a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', root).filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
})();
</script>
</body>
