<!DOCTYPE html>
<html lang="cs">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velín nabídek</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
/* Velín nabídek · konzole XpertDigital. Vzhled podle prototypu, světlý i tmavý režim. */
:root{
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace;
  --bg:#F1F1EE; --panel:#FFFFFF; --panel-2:#F8F8F5; --sunk:#EDEDE9; --app:#F6F6F3;
  --ink:#1D1D1C; --text:#444442; --muted:#686864; --faint:#8E8E89;
  --line:#E0E0DB; --line-2:#ECECE7;
  --red:#FA2B2B; --red-ink:#C51313; --red-50:#FFF0EF; --red-100:#FFD9D6; --red-btn:#E52020; --red-btn-h:#C81818;
  --green:#127250; --green-50:#E3F3EA; --amber:#8A5700; --amber-50:#FFF1D2; --blue:#1C5CAB; --blue-50:#E6EFFA;
  --chip:#ECECE8; --chip-ink:#474744;
  --rail:#292928; --rail-2:#383837; --rail-line:#4A4A48; --on-rail:#FFFFFF; --on-rail-muted:#BDBDB7;
  --bar:#3C3C3A; --track:#E8E8E3; --axis:#C4C4BE; --warm:#E09A00;
  --h0:#EAEAE5; --h1:#FDD3CF; --h2:#F7A099; --h3:#EE5F57; --h4:#CC1C1C;
  --s-yes:#15805A; --s-maybe:#EFB02E; --s-no:#7A7A75; --warm-bar:#E09A00;
  --shadow:0 1px 2px rgba(25,25,20,.04),0 14px 34px rgba(25,25,20,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#131312; --panel:#1C1C1B; --panel-2:#222221; --sunk:#2A2A28; --app:#171716;
    --ink:#F2F2EE; --text:#D2D2CD; --muted:#A2A29C; --faint:#7C7C77;
    --line:#343432; --line-2:#2A2A28;
    --red:#FF4545; --red-ink:#FF7C74; --red-50:#3B1715; --red-100:#5A201C; --red-btn:#E52020; --red-btn-h:#FF3A3A;
    --green:#4CC592; --green-50:#15301F; --amber:#EDB24D; --amber-50:#33280E; --blue:#86B4F0; --blue-50:#17273C;
    --chip:#2C2C2A; --chip-ink:#D0D0CA;
    --rail:#0C0C0B; --rail-2:#222221; --rail-line:#383836; --on-rail:#FFFFFF; --on-rail-muted:#A6A6A0;
    --bar:#D4D4CE; --track:#2E2E2C; --axis:#4A4A47; --warm:#EDB24D;
    --h0:#262624; --h1:#4B1D1A; --h2:#7F2621; --h3:#C0322A; --h4:#FF5A4F;
    --s-yes:#2FA878; --s-maybe:#D9A23A; --s-no:#6F6F6A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 34px rgba(0,0,0,.35);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--app);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,h5{margin:0;color:var(--ink)}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.9em}
:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--on-rail);padding:18px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.rail-brand .mark{width:32px;height:32px;border-radius:10px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;flex:none}
.rail-brand b{display:block;font-stretch:80%;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.03em;line-height:1.1}
.rail-brand span{display:block;font-size:11.5px;color:var(--on-rail-muted)}
.rnav{display:flex;flex-direction:column;gap:2px}
.rnav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--on-rail-muted);text-align:left;white-space:nowrap}
.rnav button:hover,.rnav button[aria-current="page"]{background:var(--rail-2);color:var(--on-rail)}
.rnav button[aria-current="page"] .ic{color:var(--red)}
.rnav .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--rail-line);border-radius:999px;padding:0 7px;color:var(--on-rail)}
.rnav .cnt.hot{background:var(--red-btn);color:#fff}
.rail-h{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--on-rail-muted);padding:0 10px;margin-bottom:6px}
.rshort button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--on-rail-muted);text-align:left}
.rshort button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rshort button:hover,.rshort button[aria-current="page"]{background:var(--rail-2);color:var(--on-rail)}
.rshort em{margin-left:auto;font-style:normal;font-size:11.5px;white-space:nowrap}
.rail-foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--on-rail-muted);padding:10px;border:1px dashed var(--rail-line);border-radius:10px;line-height:1.4}
.rail-foot button,.rail-foot a{color:var(--on-rail);font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.rail-foot .ic{width:15px;height:15px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--faint)}
.dot.live{background:var(--red);box-shadow:0 0 0 3px rgba(250,43,43,.25)}
.dot.act{background:var(--warm)}
.dot.ok{background:var(--green)}
.main{padding:24px 28px 40px;min-width:0;max-width:1320px}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 12px;overflow-x:auto}
  .rail-brand span,.rshort,.rail-foot .note{display:none}
  .rnav{flex-direction:row}
  .rail-foot{margin:0 0 0 auto;border:0;padding:0;display:flex;flex:none}
  .main{padding:18px 16px 30px}
}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.vh h3{font-size:28px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.005em;line-height:1}
.vh h3:focus{outline:none}
.vh p{font-size:13.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ph h4{font-size:15.5px;font-weight:700}
.ph span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:14px;align-content:start;min-width:0}
.mt{margin-top:14px}
@media (max-width:900px){.g2,.g2e{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 13px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:27px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.01em}
.kpi .d{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spark{width:120px;height:28px;display:block;margin-top:4px}
.sp-l{fill:none;stroke:var(--bar);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sp-a{fill:var(--bar);opacity:.1}
.sp-d{fill:var(--red);stroke:var(--panel);stroke-width:2}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.6;background:var(--chip);color:var(--chip-ink)}
.chip .ic{width:13px;height:13px}
.chip.hot,.chip.bad{background:var(--red-50);color:var(--red-ink)}
.chip.warm{background:var(--amber-50);color:var(--amber)}
.chip.cold{background:var(--blue-50);color:var(--blue)}
.chip.ok{background:var(--green-50);color:var(--green)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chip.dark{background:var(--ink);color:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;font-weight:700;font-size:13px;padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.red{background:var(--red-btn);border-color:var(--red-btn);color:#fff}
.btn.red:hover{background:var(--red-btn-h);border-color:var(--red-btn-h)}
.btn .ic{width:15px;height:15px}
.btn[disabled]{opacity:.55;cursor:default}
.lnk{font-size:13px;font-weight:700;color:var(--red-ink);display:inline-flex;align-items:center;gap:5px;text-decoration:none}
.lnk .ic{width:15px;height:15px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink);flex:none}
.av.big{width:38px;height:38px;font-size:13px}
.av.q{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint);color:var(--muted)}
.av .ic{width:15px;height:15px}
.tw{overflow-x:auto;position:relative}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t tr.click{cursor:pointer}
.t tr.click:hover td,.t tr.click:focus-visible td{background:var(--panel-2)}
.t tr.click:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.cl b{display:block;color:var(--ink);font-weight:700;white-space:nowrap}
.cl span{font-size:12.5px;color:var(--muted)}
.mini-w{display:inline-block;line-height:0}
.mini-b{fill:var(--bar)}.mini-now{fill:var(--red)}.mini-base{stroke:var(--axis);stroke-width:1}
.fd{display:inline-flex;gap:4px;align-items:center}
.fd i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--faint)}
.fd i.sent{background:var(--ink);box-shadow:none}
.fd i.draft{background:linear-gradient(90deg,var(--warm) 50%,transparent 50%);box-shadow:inset 0 0 0 1.5px var(--warm)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}
.empty b{color:var(--ink)}
.live-row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line-2)}
.live-row:last-child{border-bottom:0}
.live-row b{color:var(--ink)}
.live-row p{font-size:13.5px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;margin-top:5px;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(250,43,43,.5)}70%{box-shadow:0 0 0 10px rgba(250,43,43,0)}100%{box-shadow:0 0 0 0 rgba(250,43,43,0)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.feed{display:grid}
.fi{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.fi:last-child{border-bottom:0}
.fi b{color:var(--ink);font-weight:700}
.fi small{display:block;font-size:12px;color:var(--muted)}
.fi.dim{opacity:.7}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
.back:hover{color:var(--ink)}
.oh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:start;margin-bottom:16px}
.oh h3{font-size:32px;font-weight:800;font-stretch:78%;text-transform:uppercase;line-height:1}
.oh h3:focus{outline:none}
.oh .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.oh .bb{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
@media (max-width:760px){.oh{grid-template-columns:1fr}.oh .bb{justify-content:flex-start}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px;padding:14px 16px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.stp{position:relative;padding:20px 8px 0 0;font-size:12px;color:var(--muted);min-width:0}
.stp::before{content:"";position:absolute;top:5px;left:12px;right:0;height:2px;background:var(--line)}
.stp:last-child::before{display:none}
.stp i{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--panel);box-shadow:inset 0 0 0 2px var(--axis)}
.stp.done::before{background:var(--ink)}
.stp.done i{background:var(--ink);box-shadow:none}
.stp.cur i{background:var(--red);box-shadow:0 0 0 4px var(--red-50)}
.stp b{display:block;color:var(--ink);font-weight:700;font-size:13px}
.stp.todo b{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.tabs button{padding:10px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tabs .n{font-size:11.5px;background:var(--sunk);border-radius:999px;padding:0 6px;color:var(--muted)}
.fstat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.fs{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);display:grid;gap:5px;align-content:start}
.fs .fl{font-size:13px;font-weight:700;color:var(--ink)}
.fs .fw{font-size:12px;color:var(--muted)}
@media (max-width:900px){.fstat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.picks{grid-template-columns:1fr}}
.pk h5{font-size:13px;font-weight:800;margin-bottom:8px}
.pk ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pk li{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--panel-2)}
.pk li b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;margin-right:4px}
.pk li q{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;quotes:"„" "“"}
.split{display:flex;gap:2px;height:14px;margin:6px 0 12px}
.split span{display:block;height:14px}
.split .fx{background:var(--bar);border-radius:4px 0 0 4px}
.split .pf{background:var(--red);border-radius:0 4px 4px 0}
.hist{list-style:none;margin:0;padding:0;display:grid}
.hist li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.hist li:last-child{border-bottom:0}
.hist time{color:var(--muted);font-variant-numeric:tabular-nums}
.hist b{color:var(--ink)}
.hist .sum{white-space:pre-line;color:var(--text);font-size:13px;margin-top:4px}
.callout{border-radius:12px;padding:12px 14px;background:var(--amber-50);color:var(--text);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.callout .ic{color:var(--amber);margin-top:2px}
.callout b{color:var(--ink)}
.fig{margin:0}
.fig-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.fig-h h4{font-size:15px;font-weight:700}
.fig-h p{font-size:12.5px;color:var(--muted);margin-top:2px}
.tv{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.tv:hover{color:var(--ink);border-color:var(--ink)}
.tv .ic{width:14px;height:14px}
.fig-note{font-size:13px;color:var(--text);margin-top:12px;padding-top:10px;border-top:1px solid var(--line-2)}
.hb{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr) max-content;gap:9px 12px;align-items:center;font-size:13px}
.hb .lab{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:280px}
.hb .lab b{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:5px}
.hb .trk{height:16px;display:flex;align-items:center}
.hb .bar{height:16px;border-radius:0 4px 4px 0;background:var(--bar);display:block}
.hb .bar.em{background:var(--red)}
.hb .val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;text-align:right;white-space:nowrap}
.heat{display:grid;gap:3px;font-size:12px;align-items:center}
.heat .hl{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px;min-width:0}
.heat .c{height:28px;border-radius:3px;background:var(--h0);display:block}
.heat .c[data-l="1"]{background:var(--h1)}.heat .c[data-l="2"]{background:var(--h2)}.heat .c[data-l="3"]{background:var(--h3)}.heat .c[data-l="4"]{background:var(--h4)}
.heat .xl{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap}
.hscale{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.hscale i{width:18px;height:10px;border-radius:2px;display:inline-block;background:var(--h0)}
.hscale i[data-l="1"]{background:var(--h1)}.hscale i[data-l="2"]{background:var(--h2)}.hscale i[data-l="3"]{background:var(--h3)}.hscale i[data-l="4"]{background:var(--h4)}
.readers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.rc{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel);display:grid;gap:12px;align-content:start}
.rc-top{display:flex;gap:10px;align-items:center}
.rc-top b{display:block;color:var(--ink)}
.rc-top span{font-size:12.5px;color:var(--muted)}
.rc dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;margin:0;font-size:12.5px}
.rc dt{color:var(--muted)}
.rc dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.tl-day{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 0 6px}
.tl-day:first-child{padding-top:0}

/* ---------- přihlášení vlastníka na vlastní adrese (Google Identity Services) ---------- */
// Kolega se prokazuje kódem z odkazu. Vlastník tokenem Google, který platí hodinu a obnovuje se automatickým přihlášením;
// token drží jen tahle karta (sessionStorage), server ho ověří u Googlu.
const AUTH = { token: '', exp: 0, ready: false, waiting: [] };
const jwtExp = t => { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; } };
function setToken(t) {

}
function idToken() {

  if (AUTH.token && AUTH.exp - Date.now() > 60000) return Promise.resolve(AUTH.token);

    const w = { res: res, rej: rej };
    AUTH.waiting.push(w);
    gisPrompt();
    setTimeout(() => { const i = AUTH.waiting.indexOf(w); if (i >= 0) { AUTH.waiting.splice(i, 1); rej(new Error('Přihlášení vypršelo, přihlaste se znovu.')); } }, 15000);

}
function gisPrompt() { if (gisReady()) google.accounts.id.prompt(); else setTimeout(gisPrompt, 300); }

  google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'cs', width: 260 });
}
function signOut() {

}

function tFilled(o) {
  const st = o.forms || {}, d = o.inp && o.inp.data ? o.inp.data : null, lastH = o.hist[o.hist.length - 1];
  const whoLast = lastH && lastH.who ? lastH.who.name : '';
  const strip = '<div class="fstat">' + FORMS.map(f => {
    const s = st[f[0]];
    return '<div class="fs"><span class="fl">' + f[1] + '</span>' + (s === 'sent' ? chip('ok', 'Odesláno', 'check') : s === 'draft' ? chip('warm', 'Rozpracováno') : chip('line', 'Nic')) +
      '<span class="fw">' + (s === 'sent' ? (whoLast ? esc(whoLast) + ' · ' : '') + when(o.inp.savedAt) + (st[f[0] + 'Draft'] ? ' · pak změny' : '') : s === 'draft' ? 'neodesláno' : '—') + '</span></div>';
  }).join('') + '</div>';
  const out = [strip];
  const since = (o.inp ? o.inp.savedAt : 0) + 3000, ED = [];
  o.sess.forEach(s => (s.edits || []).forEach(e => { if (e[0] > since) ED.push({ t: e[0], k: e[1], x: e[2], who: s.who }); }));
  ED.sort((a, b) => a.t - b.t);
  if (ED.length) {
    const inputs = {}; (o.meta.inputs || []).forEach(i => { inputs[i.id] = i.label; });
    const fields = Array.from(new Set(ED.filter(e => e.k === 'f').map(e => e.x))).map(f => f === 'kpi' ? 'vlastní ukazatele' : f === 'wish' ? 'přání' : f === 'reset' ? 'vrácení odhadů' : inputs[f] || f);
    const picks = new Set(ED.filter(e => e.k === 'p' || e.k === 'n').map(e => e.x)).size, price = ED.filter(e => e.k === 'c').length, last = ED[ED.length - 1];
    out.push('<div class="callout mt">' + icon('pencil') + '<span><b>Rozpracováno, zatím neodesláno.</b> ' + (fields.length ? 'Pole: ' + esc(fields.join(', ')) + '. ' : '') + (picks ? 'Výběr u ' + picks + ' ' + plural(picks, 'karty', 'karet', 'karet') + '. ' : '') + (price ? 'Změny ceny: ' + price + '×. ' : '') +
      'Hodnoty uvidíme, až je klient odešle. Naposledy ' + esc(last.who.name) + ', ' + when(last.t) + '.</span></div>');
  }
  if (!d) { if (!ED.length) out.push('<div class="empty mt">Zatím nic neodeslali. Formuláře se tu ukážou, jakmile klient klikne na <b>Uložit a poslat</b>.</div>'); return out.join(''); }
  const edited = (o.meta.inputs || []).filter(i => d.edited && d.edited[i.id]);
  if (edited.length) out.push('<div class="panel mt"><div class="ph"><h4>Vaše čísla</h4><span>' + (whoLast ? esc(whoLast) + ' · ' : '') + when(o.inp.savedAt) + '</span></div>' + table(['Ukazatel', 'Náš odhad', 'Jejich číslo', 'Rozdíl'], edited.map(i => {
    const own = +d.values[i.id], diff = i.value ? own / i.value - 1 : 0;
    return [esc(i.label) + (i.unit ? ' <span style="color:var(--muted)">(' + esc(i.unit) + ')</span>' : ''), fmt(i.value, i.value % 1 ? 1 : 0), '<b style="color:var(--ink)">' + fmt(own, own % 1 ? 1 : 0) + '</b>', chip('line', (diff >= 0 ? '+' : '−') + fmt(Math.abs(diff) * 100) + ' %')];
  }), [1, 2, 3]) + '</div>');
  const kp = (d.kpis || []).filter(k => k && String(k.name || '').trim());
  if (kp.length) out.push('<div class="panel mt"><div class="ph"><h4>Vlastní ukazatele</h4></div>' + table(['Ukazatel', 'Dnes', 'Cíl', 'Jednotka'], kp.map(k => ['<b style="color:var(--ink)">' + esc(k.name) + '</b>', esc(k.now || '—'), esc(k.goal || '—'), esc(k.unit || '')]), [1, 2]) + '</div>');
  const P = d.prio || {}, ids = Object.keys(P).filter(id => P[id] && (P[id].p || P[id].note));
  if (ids.length) {
    const col = (p, label, cls) => { const it = ids.filter(id => P[id].p === p); return '<div class="pk"><h5>' + chip(cls, label + ' · ' + it.length) + '</h5><ul>' + (it.length ? it.map(id => '<li><b>' + esc(id) + '</b>' + esc(cardTitle(o, id)) + (P[id].note ? '<q>' + esc(P[id].note) + '</q>' : '') + '</li>').join('') : '<li>nic</li>') + '</ul></div>'; };
    out.push('<div class="panel mt"><div class="ph"><h4>Boostery</h4><span>' + ids.length + ' ' + plural(ids.length, 'karta', 'karty', 'karet') + '</span></div><div class="picks">' + col('yes', 'Chceme', 'ok') + col('maybe', 'Možná', 'warm') + col('no', 'Nechceme', '') + '</div></div>');
  }
  if (o.meta.presets && d.fixed != null && st.price === 'sent') {
    const fx = Math.round(d.fixed * 100), pr = (o.meta.presets || []).find(p => Math.abs(p.fixed - d.fixed) < 0.001);
    out.push('<div class="panel mt"><div class="ph"><h4>Cena: ' + (pr ? esc(pr.label) + ', ' : '') + fx + ' % pevně</h4><span>' + (100 - fx) + ' % podle výsledku</span></div><div class="split" role="img" aria-label="' + fx + ' % pevně, ' + (100 - fx) + ' % podle výsledku"><span class="fx" style="width:' + fx + '%"></span><span class="pf" style="width:' + (100 - fx) + '%"></span></div>' +
      '<p style="font-size:13.5px">' + (fx >= 100 ? 'Celá cena pevně, bez výkonové složky.' : 'Klient chce sdílet riziko: ' + (100 - fx) + ' % ceny navážeme na splnění cíle.') + '</p></div>');
  }
  const mods = (o.meta.weeks || []).filter(w => w[3]), areas = o.meta.areas || [];
  if (mods.length || (d.calc && areas.length)) {
    const rows = mods.map(w => ['Modul ' + esc(w[1] || w[2]), d.modules && d.modules[w[0]] ? chip('ok', 'ano') : chip('line', 'ne')])

    out.push('<div class="panel mt"><div class="ph"><h4>Moduly a kalkulačka</h4><span>jak je odeslali</span></div>' + table(['', 'Nastavení'], rows, [1]) + '</div>');
  }
  if (String(d.wish || '').trim()) out.push('<div class="panel mt"><div class="ph"><h4>Přání</h4></div><p style="font-size:15px;color:var(--ink)">„' + esc(d.wish.trim()) + '“</p></div>');
  out.push('<div class="panel mt"><div class="ph"><h4>Historie změn</h4><span>každé odeslání je nová verze, rozdíl proti předchozí</span></div><ul class="hist">' + o.hist.slice().reverse().map(h =>
    '<li><time>' + when(h.at) + '</time><span><b>' + esc(h.who ? h.who.name + (h.who.role ? ', ' + h.who.role : '') : h.p ? 'kód ' + h.p : 'bez jména') + '</b>' +
    (h.diff && h.diff.length ? '<ul class="diff">' + h.diff.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<div class="sum">beze změn proti předchozí verzi</div>') + '</span></li>').join('') + '</ul></div>');
  return out.join('');
}

function tReaders(o) {
  const byKey = {};
  o.sess.forEach(s => { (byKey[s.who.key] = byKey[s.who.key] || []).push(s); });
  const cards = Object.keys(byKey).map(k => {

  const B = A.boosters.slice(0, 14), nB = Math.max(1, Math.max.apply(null, B.map(b => b.yes + b.maybe + b.no).concat([1])));
  const seg = (b, k, l) => b[k] ? '<span class="sg ' + k + '" tabindex="0" style="width:' + (b[k] / nB * 100) + '%" data-tip="' + esc(b[k] + '× ' + l + '\n' + b.offers.join(', ')) + '">' + b[k] + '</span>' : '';
  const boost = fig('Boostery napříč nabídkami', 'Volby z odeslaných výběrů, stejné schopnosti sloučené', B.length ? '<div class="legend"><span><i class="yes"></i>Chceme</span><span><i class="maybe"></i>Možná</span><span><i class="no"></i>Nechceme</span></div><div class="sb">' + B.map(b => '<span class="lab">' + esc(b.label) + '</span><span class="trk">' + seg(b, 'yes', 'Chceme') + seg(b, 'maybe', 'Možná') + seg(b, 'no', 'Nechceme') + '</span>').join('') + '</div>' : '<p class="fig-note">Zatím žádný odeslaný výběr.</p>',
